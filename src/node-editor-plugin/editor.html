<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lineage Logo editor</title>
<style>
  :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #eceae4; color: #242320; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; }
  main { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) 18rem; }
  .workspace { min-width: 0; display: grid; grid-template-rows: auto 1fr; }
  header { padding: .75rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; background: #242320; color: #fff; }
  h1 { margin: 0; font-size: 1rem; }
  #status { margin: 0; font-size: .8rem; color: #dad7cf; }
  .stage { overflow: auto; display: grid; place-items: center; padding: 2rem; background: radial-gradient(circle, #f7f6f2 0 1px, transparent 1px) 0 0 / 16px 16px, #dfdcd4; }
  #artboard { width: min(65vh, 42rem); aspect-ratio: 1; display: grid; place-items: center; padding: 2rem; background: white; box-shadow: 0 12px 40px rgb(0 0 0 / 18%); }
  #artboard svg { width: 100%; height: 100%; overflow: visible; }
  aside { overflow: auto; padding: 1rem; border-left: 1px solid #ccc8be; background: #f7f6f2; }
  aside h2 { margin: 0 0 .75rem; font-size: .9rem; }
  label, .field { display: grid; gap: .25rem; margin: .55rem 0; font-size: .72rem; font-weight: 700; }
  input, select, button { min-height: 2rem; font: inherit; }
  input, select { width: 100%; border: 1px solid #bbb7ad; border-radius: 4px; padding: .4rem; background: white; }
  .row { display: flex; gap: .4rem; flex-wrap: wrap; margin: .55rem 0; }
  button { border: 1px solid #aaa69c; border-radius: 4px; padding: .4rem .65rem; background: white; cursor: pointer; }
  button.primary { color: white; border-color: #242320; background: #242320; }
  button:disabled, input:disabled { opacity: .45; cursor: default; }
  small { min-height: 1em; color: #8a2c25; }
  #selection-empty { color: #77736b; font-size: .8rem; }
  .advanced { margin-top: .8rem; }
  .advanced summary { cursor: pointer; font-size: .75rem; font-weight: 800; }
  .sr-controls { display: none; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid #ccc8be; } }
</style>
<main>
  <section class="workspace">
    <header><h1>Lineage Logo editor</h1><p id="status" role="status">Connecting securely to Lineage…</p></header>
    <div class="stage"><div id="artboard" aria-label="Logo canvas"></div></div>
  </section>
  <aside>
    <h2 id="selection-name">Selection</h2>
    <p id="selection-empty">Select a shape to make a manual correction.</p>
    <div id="selection-panel" hidden>
      <label>Layer name <input id="layer-name"><button id="clear-layer-name" type="button">Clear name</button></label>
      <label>Fill <input id="fill"><input id="fill-picker" type="color"><span id="fill-state"></span><small id="fill-error"></small></label>
      <label>Stroke <input id="stroke"><input id="stroke-picker" type="color"><span id="stroke-state"></span><small id="stroke-error"></small></label>
      <label>Stroke width <input id="stroke-width" type="number" step="0.1"></label>
      <label>Opacity <input id="opacity" type="number" min="0" max="1" step="0.05"></label>
      <div class="row"><button id="duplicate-selection">Duplicate</button><button id="delete-selection">Delete</button></div>
      <details class="advanced"><summary>More transforms</summary>
        <div class="row"><button id="align-left">Left</button><button id="align-center">Center</button><button id="align-right">Right</button><button id="align-top">Top</button><button id="align-middle">Middle</button><button id="align-bottom">Bottom</button></div>
        <small id="alignment-reason"></small>
        <div class="row"><button id="distribute-horizontal">Distribute H</button><button id="distribute-vertical">Distribute V</button><button id="space-horizontal">Space H</button><button id="space-vertical">Space V</button></div>
        <div class="row"><button id="group-selection">Group</button><button id="ungroup-selection">Ungroup</button><button id="reorder-earlier">Earlier</button><button id="reorder-later">Later</button></div>
        <small id="hierarchy-reason"></small>
        <div class="row"><button id="lock-selection">Lock</button><button id="hide-selection">Hide</button></div>
        <label>X <input id="position-x" type="number"></label><label>Y <input id="position-y" type="number"></label>
        <label>Width <input id="position-width" type="number"></label><label>Height <input id="position-height" type="number"></label>
        <label><input id="aspect-lock" type="checkbox"> Lock aspect ratio</label><span id="geometry-mode"></span><small id="geometry-error"></small>
        <label>Rotation <input id="rotation" type="number"></label><label>Scale <input id="scale" type="number"></label>
        <label>Text <input id="text-content"></label><label>Font family <input id="text-family"></label>
        <label>Font size <input id="text-size" type="number"></label><label>Weight <input id="text-weight"></label>
        <label>Alignment <select id="text-anchor"><option>start</option><option>middle</option><option>end</option></select></label>
        <label>Letter spacing <input id="text-letter-spacing"></label><small id="text-error"></small>
      </details>
    </div>
    <label>Edit summary <input id="summary" maxlength="2048" value="Manual correction in Lineage Logo"></label>
    <div class="row"><button id="save" class="primary" disabled>Save edit</button><button id="cancel" disabled>Cancel</button></div>
  </aside>
</main>
<script>__LINEAGE_NODE_EDITOR_SCRIPT__</script>
</html>
