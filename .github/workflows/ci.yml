name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser QA
        run: npm run test:e2e

      - name: Upload metadata-only browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-qa-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  critical-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install critical-path browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run critical path in ${{ matrix.browser }}
        run: npx playwright test tests/e2e/release/critical-path.spec.ts --project=${{ matrix.browser }}-critical

      - name: Upload metadata-only sanitized diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.browser }}-critical-diagnostics
          path: test-results/release-diagnostics.json
          if-no-files-found: ignore
          retention-days: 7

  clean-install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack, clean-install, reinstall same artifact, and inspect public CLI
        run: npx tsx scripts/release-check.ts
