name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Check out exact Lineage node-editor contract
        uses: actions/checkout@v7
        with:
          repository: lineagehq/lineage
          ref: 028636f18590a179334501e0dcd2a1746d9f7595
          path: .lineage-contract

      - name: Build and verify node-editor plugin
        run: |
          npm run node-editor-plugin:build
          npm run node-editor-plugin:test
          npm run node-editor-plugin:conformance -- --lineage-contract-root "$GITHUB_WORKSPACE/.lineage-contract"
          npm run node-editor-plugin:artifact:repro

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser QA
        run: |
          npm run node-editor-plugin:build
          npm run node-editor-plugin:browser-smoke
          npm run test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-qa-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
