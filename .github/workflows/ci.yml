name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify performance open timing includes document loading
        run: LINEAGE_LOGO_PERFORMANCE_OPEN_REGRESSION=1 npx vitest run --config vitest.config.ts tests/ux-performance-open.test.ts

      - name: Run browser QA
        run: npm run test:e2e -- --project=chromium

      - name: Upload metadata-only browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-qa-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  critical-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install critical-path browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run critical path in ${{ matrix.browser }}
        run: npx playwright test tests/e2e/release/critical-path.spec.ts --project=${{ matrix.browser }}-critical

      - name: Upload metadata-only sanitized diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.browser }}-critical-diagnostics
          path: test-results/release-diagnostics.json
          if-no-files-found: ignore
          retention-days: 7

  clean-install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack, clean-install, reinstall same artifact, and inspect public CLI
        run: npx tsx scripts/release-check.ts --candidate-receipt

      - name: Record tested candidate digest
        uses: actions/upload-artifact@v7
        with:
          name: candidate-${{ matrix.os }}
          path: candidate-artifact.json
          if-no-files-found: error

  newer-lts:
    name: Node 24.20.0 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx tsx scripts/release-check.ts --candidate-receipt
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-node24
          path: candidate-artifact.json
          if-no-files-found: error
