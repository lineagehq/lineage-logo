# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Multi-Selection Movement and Distribution"
  slug: "multi-selection-movement-distribution"
  kind: existing_plan
  tranche: "Prove the merged selector, then deliver collective translation and deterministic distribution/spacing through live complex-logo QA."
  status: done
  oracle:
    signal: "On the live complex Seatify example at 100% and non-default zoom, a cross-parent multi-selection collectively drags and nudges by one visual root-space delta, distributes and equal-spaces deterministically, survives one-step undo/redo per action, and preserves selection, Layers parity, clean serialization, and gesture coexistence."
    cadence: "after each Worker package and at final audit"
    final_proof: "Green npm run check, recorded post-merge and final browser transcripts, and a final Judge receipt mapping every oracle clause with full_outcome_complete: true."
  intake:
    original_request: "Create and execute a GoalBuddy-ready plan for post-merge smoke, multi-selection movement, and distribution, excluding collective resize and rotation from the first tranche."
    interpreted_outcome: "Users can safely translate and distribute selected SVG objects across nested parent coordinate systems without selection, history, gesture, or fidelity regressions."
    input_shape: existing_plan
    audience: "Lineage Logo users editing layered and nested SVG marks"
    authority: requested
    proof_type: demo
    completion_proof: "Automated checks and a repeatable live Seatify walkthrough prove collective drag, keyboard nudge, deterministic distribution/spacing, undo/redo, cancellation, eligibility gating, and clean SVG output."
    likely_misfire: "Add controls or a primary drag affordance while only one object moves, cross-parent objects drift, ineligible selections partially mutate, or history splits one gesture into multiple checkpoints."
    blind_spots_considered:
      - "Cross-parent root-space delta conversion through nested transforms and viewBox zoom."
      - "Transform composition without descendant rewrites or resource/reference damage."
      - "All-or-nothing gating for locked, hidden, disconnected, resource-heavy, and agent-blocked selections."
      - "Gesture precedence with marquee, precise toggle, pan, ordinary drag, resize, and rotation."
      - "One checkpoint per action and none for cancel, threshold, invalid, or no-op paths."
      - "Deterministic distribution order, fixed outer anchors, overlap, zero-size objects, and equal-gap semantics."
      - "Selection identity, scope, halo, count badge, Layers parity, responsive sidebars, reduced motion, and serialization cleanliness."
      - "Performance and usability on the saved 40+ layer complex Seatify SVG."
    existing_plan_facts:
      - "Run a post-merge smoke before implementation."
      - "Implement collective drag and Arrow/Shift+Arrow nudge first."
      - "Add horizontal and vertical distribution and spacing second."
      - "Keep settings in the compact existing dialog; do not create a settings page."
      - "Defer collective resize/rotation and agent-driven layer insertion."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/multi-selection-movement-distribution/"
    command: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/multi-selection-movement-distribution"

active_task: null

tasks:
