      - "src/client/canvas"
      - "src/client/main.ts"
      - "src/client/ui"
      - "tests/editor-interactions.test.ts"
      - "tests/editor-serialization.test.ts"
      - "tests/client-ux.test.ts"
      - "docs/goals/marquee-selection-preferences"
    constraints:
      - "Read-only."
      - "Do not edit implementation files or generate a patch."
      - "Trace current single-object drag/nudge checkpoint boundaries and cross-parent transform math with exact file-path evidence."
      - "Identify all-or-nothing gating requirements and conflicts with primary-only handles."
      - "Map deterministic distribution alternatives, but do not select product semantics."
    expected_output:
      - "Coordinate and gesture seam map"
      - "History and serialization boundary map"
      - "Eligibility and failure-mode map"
      - "Existing test seams and missing concrete proofs"
      - "Largest safe collective-translation Worker candidate"
      - "Distribution semantic choices requiring Judge decision"
    receipt:
      result: done
      summary: "Mapped the existing selection, drag, history, coordinate, and UI seams without product writes."
      evidence:
        - "src/client/canvas/editor.ts installed drag/resize/rotation only on the primary and explicitly returned from Arrow handling unless exactly one node was selected."
        - "SVG.js dragmove exposes the native pointer event and prevents its own mutation when the editor cancels the event, allowing one editor-owned collective gesture."
        - "Existing alignmentOffsets and applyAlignmentOffsets operate in one parent space; cross-parent work requires root-relative parent matrices."
        - "History snapshots already preserve selection keys, primary identity, and scope; one gesture-level checkpoint can restore all context."
        - "Selection halos, Layers parity, and serialization stripping already cover all selected nodes and need no new persistent metadata."
      largest_safe_worker: "Root-space collective drag and Arrow/Shift+Arrow nudge with all-or-nothing gating, one checkpoint, exact cancellation, tests, and no collective resize/rotation."

  - id: T003
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the collective-translation interaction and coordinate contract, reconcile T001/T002 evidence, and authorize the largest safe useful Worker package."
    inputs:
      - "T001 receipt"
      - "T002 receipt"
      - "Goal oracle and non-goals"
      - "Current diff and repository instructions"
    constraints:
      - "Read-only; do not implement."
      - "Reject a design that moves only the primary, rewrites descendants unnecessarily, partially moves an ineligible set, or adds collective resize/rotation."
      - "Specify drag and keyboard checkpoint boundaries, cancellation, no-op behavior, selection preservation, and platform behavior."
      - "Choose the largest safe vertical slice with explicit allowed_files, verify, and stop_if."
    expected_output:
      - "approve | revise | block"
      - "Exact collective-translation Worker objective"
      - "Coordinate and interaction contract"
      - "allowed_files"
      - "verify"
      - "stop_if"
      - "Deferred distribution questions"
    receipt:
      result: done
      decision: approve
      contract:
        - "Intercept only multi-selected primary dragmove, derive absolute pointer displacement in root SVG units, and prevent the plugin from mutating only the primary."
        - "For each selected node, convert the shared root delta through the inverse linear parent-to-root matrix and update only that node's root transform."
        - "Gate connected, visible, unlocked, non-agent-blocked selections before mutation; reject the entire action on any invalid or singular coordinate space."
        - "One completed drag or keypress is one checkpoint; Escape, sub-three-pixel drag, zero delta, and rejected work create none."
        - "Preserve the same selection order, primary, scope, handles, halos, Layers rows, and authored descendants."
      allowed_files:
        - "src/client/canvas/editor.ts"
        - "src/client/canvas/transform.ts"
        - "tests/editor-interactions.test.ts"
        - "tests/editor-serialization.test.ts"
        - "tests/client-ux.test.ts"
        - "README.md"
      deferred: "Distribution semantics and controls remain T005; collective resize and rotation remain excluded."

