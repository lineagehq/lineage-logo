version: 2

goal:
  title: "Complex Logo Dogfood and Session Restoration"
  slug: complex-logo-dogfood
  kind: existing_plan
  tranche: "Build the complex stress asset, dogfood it, fix confirmed defects, implement safe versioned restoration, and prove the complete reload-and-restart oracle."
  status: done
  oracle:
    signal: "A 30–50-layer Seatify logo completes the documented manual-and-agent walkthrough and restores its expected workspace state after reload and local server restart."
    cadence: "after each Worker package and at final audit"
    final_proof: "Receipts for the complex asset, adversarial walkthrough, confirmed-defect fixes, versioned restoration, npm run check, and a final browser restart transcript with full_outcome_complete: true."
  intake:
    original_request: "Plan a more complex layered logo dogfood pass, fixes, and session restoration."
    interpreted_outcome: "The canvas is proven and polished for complex SVG editing, with reliable workspace restoration."
    input_shape: existing_plan
    audience: "Lineage Logo users and logo-designer agents"
    authority: approved
    proof_type: demo
    completion_proof: "Complex asset artifact, passing repository gate suite, and a successful adversarial browser walkthrough including save/reload and restart restoration."
    likely_misfire: "Creating a complex-looking logo without exercising or fixing difficult editor behavior."
    blind_spots_considered:
      - "Decorative complexity instead of structurally meaningful hierarchy"
      - "Unsupported defs, masks, clipping, transforms, or text behavior"
      - "Selection or navigation accidentally dirtying the document"
      - "Large layer-tree usability and performance"
      - "Stale persisted documents or element identifiers"
      - "Cross-tab agent ownership and restart behavior"
      - "Persisting sensitive or unbounded SVG contents"
    existing_plan_facts:
      - "Create a complex Seatify stress logo first."
      - "Run an adversarial editing session against it."
      - "Fix concrete issues revealed by the stress test."
      - "Add session restoration after editor behavior is stabilized."
      - "Defer agent-driven insertion of entirely new SVG layers."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/complex-logo-dogfood/"
    command: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/complex-logo-dogfood"

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Map complex-SVG risk surfaces, existing fixtures and save paths, workspace persistence behavior, and verification seams without editing product files."
    inputs:
      - README.md
      - package.json
      - src
      - tests
      - docs/goals
      - "/Users/neonwatty/Desktop/seatify-logo-dogfood/logos (read-only evidence only)"
    constraints:
      - "Read-only."
      - "Do not edit implementation, tests, or asset files."
      - "Keep searches inside the repository except for the explicitly named Seatify workspace evidence path."
      - "Return concrete file-path evidence, current capability boundaries, and candidate QA scenarios."
    expected_output:
      - "Complex SVG capability and risk map"
      - "Current fixture, save, reload, and restoration map"
      - "Repository gate and targeted verification commands"
      - "Proposed exact location and structure for the stress asset"
      - "Recommended largest safe first Worker package"
    receipt:
      result: done
      summary: "Current editor supports meaningful nested groups, basic geometry, bounded text/paint, sibling multi-selection, alignment, grouping, reorder, undo/redo, clean serialization, and numbered saves. Key stress risks are resource-backed shape handles, style-driven organization lockouts, hierarchy constraints, large-tree UX, and absent general workspace restoration. Only sidebar preferences and pending-agent recovery persist today. The safest first Worker package is a deterministic repository fixture, structural/round-trip assertions, and a versioned walkthrough—without product-code changes."
      evidence:
        - path: "src/client/canvas/editor.ts:79"
          finding: "Editable nodes are limited to g, path, rect, circle, ellipse, polygon, polyline, line, and text; defs/resources and nested SVG content are excluded from selection."
        - path: "src/client/canvas/editor.ts:618"
          finding: "Any style element disables grouping, ungrouping, and reordering; group requires adjacent same-parent siblings, while alignment allows multiple same-parent siblings."
        - path: "src/client/canvas/editor.ts:1010"
          finding: "Direct resize/rotate/drag handles are withheld from non-group elements using url(#...) resources, making gradient/clip/mask-backed shapes an explicit QA boundary."
        - path: "src/client/canvas/editor.ts:450"
          finding: "Clean serialization clones the SVG, strips editor handles and reserved transient attributes, preserves ordinary source SVG, and removes legacy metadata#lineage-logo-edit."
        - path: "src/client/main.ts:985"
          finding: "Opening a file resets collapsed layer keys, search, zoom to 1, selection/history through editor.load, and current document state; no ordinary active-document restoration exists."
        - path: "src/client/ui/layout.ts:18"
          finding: "Only left/right collapsed preferences persist in localStorage under versioned v1 keys; responsive collapse is temporary."
        - path: "src/client/main.ts:48"
          finding: "sessionStorage persistence is narrowly scoped to pending-agent review recovery and includes SVG, session identity, revision, source path, and dirty state."
        - path: "src/server/workspace.ts:74"
          finding: "Saving validates a maximum 5 MiB SVG, verifies the source exists, creates a new iterations/iteration-N.svg atomically, and never overwrites the source."
        - path: tests/fixtures/workspace/concepts/concept-1.svg
          finding: "Existing workspace fixture covers a gradient, clipPath, mask, filter, transform, path, rect, and group, but has too few editable layers and shallow hierarchy for the oracle."
        - path: /Users/neonwatty/Desktop/seatify-logo-dogfood/logos/concepts/concept-1.svg
          finding: "Canonical Seatify concept is only 1.5 KiB with roughly 12 editable nodes and shallow logo/icon/seating/wordmark hierarchy; it is useful design evidence but insufficient as the destructive stress fixture."
        - path: "tests/editor-serialization.test.ts:547"
          finding: "Existing seams cover organization, resource/reference round trips, multi-selection alignment, ancestry, deterministic labels, and nearest-surviving-ancestor fallback."
        - path: "tests/workspace.test.ts:15"
          finding: "Existing server seams cover listing, byte-exact reads, traversal/symlink rejection, active/external content rejection, numbering, non-overwrite saves, and metadata preservation."
      facts:
        - category: capability_boundary
          value: "Use source aria-label values for meaningful layer names; IDs remain reference identities. Avoid style elements in the primary stress asset because they intentionally disable organization operations."
        - category: capability_boundary
          value: "Use local defs resources—linear/radial gradients, clipPath, mask, and filter—but apply resource references selectively. Resource-backed leaf shapes remain selectable but do not receive direct transform handles; wrapping them in meaningful groups permits group transforms."
        - category: capability_boundary
          value: "Multi-selection grouping and reorder require adjacent siblings in one parent; alignment requires at least two siblings sharing one parent. The walkthrough must construct selections that meet and intentionally violate these rules."
        - category: fixture_map
          value: "Proposed asset: tests/fixtures/workspace/concepts/complex-seatify.svg. Target 36–44 selectable nodes, four or five hierarchy depths, deterministic local-only SVG, viewBox 0 0 1024 768, no external fonts/resources, no style element."
        - category: fixture_structure
          value: "Recommended hierarchy: logo > venue-mark > venue-shell/stage/seating-map; seating-map > table-clusters > four named table groups > table and seats; access-routes > aisles/entrance; ticket-accent > clipped/masked local shapes; wordmark > primary text/tagline. Include transforms, strokes, opacity, text, gradient paint, and meaningful adjacent siblings."
        - category: save_reload_map
          value: "Client POSTs editor.serializeClean() plus current sourcePath to /api/iterations; server validates and atomically writes the next numbered iteration; successful ordinary Save reloads the newly saved workspace file."
        - category: restoration_map
          value: "Currently persisted: sidebar preferences in localStorage and pending-agent review in sessionStorage. Not persisted generally: active file, ordinary selection/scope, zoom, preview background, layer disclosure/search, locks, undo/redo, or unsaved manual SVG."
        - category: verification
          value: "Targeted commands: npm test -- --run tests/workspace.test.ts tests/editor-serialization.test.ts tests/editor-interactions.test.ts; then npm run check."
        - category: qa_scenarios
          value: "Measure layer search/disclosure and exact nested selection; resource-backed leaf versus wrapper transforms; ten mixed edits and full undo/redo; group/reorder/alignment allowed and rejected cases; save/reopen structural equivalence; agent proposal accept/reject; stale selection fallback; reload/restart state restoration; console errors and unexpected dirty changes."
        - category: first_worker_package
          value: "Largest safe first package: add complex-seatify.svg, a focused complex fixture test asserting 30–50 selectable named layers, >=4 hierarchy depths, unique IDs/local references/no forbidden content, clean serialize/reparse structural fidelity, and a versioned walkthrough note. Do not edit src or external Seatify files."
      contradictions:
        - claim: "The final oracle expects active document, nested selection, zoom, background, and sidebar restoration."
          evidence: "Only sidebar preferences and pending-agent recovery persist; normal open resets zoom, selection, layer disclosure, and search."
          resolution: "This is planned product work for the later restoration phase, not a T003 asset requirement."
        - claim: "The oracle asks to exercise clipped or masked regions if capability permits."
          evidence: "Such leaf nodes can serialize and remain selectable, but direct transform handles are intentionally suppressed when url(#...) resources are present."
          resolution: "Include bounded resources and test fidelity; transform their meaningful wrapper group or record the leaf-handle limitation explicitly."
      ambiguity_requiring_judge:
        - question: "Should the stress fixture deliberately include one style element to test the documented organization lockout, or omit style so the same primary asset can exercise grouping/reorder?"
          recommendation: "Omit style from the primary fixture; cover the lockout in existing focused tests or a separate minimal fixture."
        - question: "Should clip/mask references be placed on transform targets despite handles being unavailable?"
          recommendation: "Place references on named leaf artwork inside transformable wrapper groups and document both behaviors in the walkthrough."
      commands:
        - "pwd && git rev-parse --show-toplevel && sed -n '1,240p' docs/goals/complex-logo-dogfood/state.yaml && sed -n '1,220p' docs/goals/complex-logo-dogfood/goal.md"
        - "rg --files -g 'AGENTS.md' -g 'AGENTS.override.md' -g '!node_modules' && sed -n '1,220p' README.md && cat package.json"
        - "rg -n \"localStorage|sessionStorage|persist|restore|serialize|save|iterations|workspace|fixture|clipPath|mask|linearGradient|radialGradient|defs|foreignObject|style\" src tests --glob '!**/*.snap'"
        - "sed -n '1,190p' src/client/ui/layout.ts; sed -n '40,120p' src/client/main.ts; sed -n '860,1115p' src/client/main.ts; sed -n '1450,1585p' src/client/main.ts"
        - "sed -n '1,210p' src/server/workspace.ts; sed -n '430,735p' src/client/canvas/editor.ts; sed -n '880,1165p' src/client/canvas/editor.ts"
        - "rg --files tests/fixtures docs/oracle | sort; rg --files /Users/neonwatty/Desktop/seatify-logo-dogfood/logos | sort; summarize Seatify SVG byte sizes"
        - "sed -n '1,220p' tests/fixtures/workspace/concepts/concept-1.svg; sed -n '1,220p' /Users/neonwatty/Desktop/seatify-logo-dogfood/logos/concepts/concept-1.svg; rg test names in targeted suites"
        - "sed -n '1,125p' src/client/canvas/editor.ts; sed -n '592,785p' tests/editor-serialization.test.ts; sed -n '1,135p' tests/workspace.test.ts"
      note_needed: false
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the existing plan and Scout evidence, then approve or revise the complex Seatify asset specification and first Worker package."
