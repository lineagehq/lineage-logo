            - "aria-label values for meaningful layer names"
          style_element_resolution: "Do not include a style element in the primary fixture. Assert its absence. Existing focused coverage may retain the organization-lockout case; changing that product behavior is deferred."
          resource_leaf_resolution: "Apply url(#...) resources only to named leaf artwork inside meaningful wrapper groups. The walkthrough must select and inspect the leaf, verify fidelity and visibility, record that direct leaf transform handles are intentionally unavailable, and move/rotate/resize the wrapper group instead."
          excluded:
