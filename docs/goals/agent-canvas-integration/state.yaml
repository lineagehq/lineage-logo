    receipt:
      result: done
      decision: not_complete
      full_outcome_complete: false
      rationale: "Not ready for final audit. The full automated gate passes, but adversarial probes exposed two high-severity transaction-lifecycle failures: browser accept/revert never reaches the producer-visible server status, and a disconnect after receiving an SSE frame but before acknowledgement can permanently strand that transaction. Pending review can also be orphaned by switching files, and valid explicit replacement of a self-contained layer with internal resources is incorrectly rejected. The recorded browser oracle is credible but lacks a durable exported artifact or replayable harness. One coherent remediation Worker package can close these gaps without changing the approved architecture; T999 must remain queued until it passes."
      evidence:
        - area: verification
          severity: pass
          finding: "Independent npm run check passed typecheck, 10 test files, 111 tests, and production build. npm audit --audit-level=high reported 0 vulnerabilities. git diff --check passed. These gates are useful but do not exercise terminal review acknowledgements, the receive-before-ack reconnect window, pending file switches, or self-contained resource replacement."
        - area: terminal_review_ack
          severity: high
          finding: "Accept/revert is only local. src/client/main.ts:468-483 calls AgentSession.accept/revert and updates local review state, but AgentCanvasTransport exposes only the staging acknowledgement at src/client/agent/transport.ts:73-86. src/server/agent-transport.ts:194-210 accepts acknowledgements only while status is delivered and only understands rejected/staged/applied; it has no pending_review -> accepted/reverted transition. An independent real-HTTP probe staged terminal-audit, attempted an accepted acknowledgement, then queried producer status; staged, terminalAttempt, and producerStatus all remained pending_review. This violates structured acknowledgement and makes the agent unable to learn the human decision."
        - area: reconnect_loss
          severity: high
          finding: "src/client/agent/transport.ts:58-60 advances Last-Event-ID before transaction acknowledgement succeeds. On disconnect, src/server/agent-transport.ts:159-170 resets delivered to queued, but reconnect replay at 152-157 sends only event.id > Last-Event-ID. An independent real-HTTP probe received event 1, disconnected before ack, reconnected with Last-Event-ID 1, and received only the connected comment while producer status remained queued. The unacknowledged transaction is therefore not replayed. Existing reconnect tests cover queued event 2 after Last-Event-ID 1, not this required receive-before-ack fault window."
        - area: pending_document_switch
          severity: medium
          finding: "The pending mutation freeze is incomplete. src/client/main.ts:602-619 permits file buttons while a proposal is pending and checks only dirty manual edits. openSvg at 626-675 replaces the canonical document and AgentSession.open clears pending state without a review decision or server acknowledgement. This can leave the producer status pending_review, stale review UI, and a proposal detached from its document. File switching is a document mutation and must be blocked or explicitly revert the pending transaction first."
        - area: explicit_replacement_references
          severity: medium
          finding: "src/client/agent/transaction.ts:135-148 treats every pre-transaction reference as a permanent obligation, even references wholly inside an explicitly replaced subtree. An independent probe replaced a self-contained logo group containing old-gradient plus its internal url(#old-gradient) with a self-contained group using new-gradient; evaluation incorrectly returned reference_damage for old-gradient. External references must remain protected, but references removed together with their explicitly replaced owner should not block a valid logo-designer replacement."
        - area: backlog_lifecycle
          severity: low
          finding: "src/server/agent-transport.ts:129 counts all historical events against maxBacklog, while terminal events are never removed from #events. A long-lived local session eventually rejects every new submission even after earlier transactions finish. Remediation should retain bounded idempotency records while pruning terminal events from the active delivery backlog."
        - area: oracle_artifact_strength
          severity: medium
          finding: "docs/oracle/T006-logo-designer.md records a real Chromium flow, exact hash, structural assertions, viewports, keyboard operation, and clean console, and T006 receipts a real adapter invocation. However no exported SVG bytes or replayable browser harness exists under docs/oracle, scripts, or tests; the sole durable artifact is the narrative receipt. The final clean-export claim should be backed by the actual saved/reopened SVG artifact and a deterministic structural/hash verifier rerun after remediation."
