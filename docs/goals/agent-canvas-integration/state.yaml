          finding: "Strict version/field/operation parsing, 5 MiB and 100-operation bounds, malformed JSON rejection, exact operation references, detached rollback, stale revision, missing/ambiguous/locked targets, invalid reorder and paint, script/foreignObject/SMIL/event/style/external URL rejection, ID collision detection, and untouched unsupported-content preservation are covered in tests/agent-protocol.test.ts and tests/agent-transaction.test.ts and passed independently in the 111-test gate."
        - area: duplicate_ordering_probe_map
          severity: partial
          finding: "Real-HTTP tests prove ordered tx-1/tx-2 delivery, exact-byte duplicate idempotency, conflicting-payload 409, newest-editor ownership, delivery timeout, disconnected status, payload/backlog limits, and ordinary Last-Event-ID replay. The receive-before-ack reconnect case fails as described, and terminal accepted/reverted duplicate semantics are absent."
        - area: hidden_locked_review_probe_map
          severity: pass
          finding: "tests/agent-review.test.ts proves nested, direct-hidden, locked, and multi-selected impact labels; transaction tests reject locked ancestors/descendants and permit hidden targets. The review UI provides accessible locate labels, an aria-live summary, keyboard-operable preview/accept/revert controls, canvas/layer markers, and isolated preview serialization. T008 and T006 record real-browser responsive and keyboard checks with a clean console. These pass for the exercised states, subject to pending file-switch remediation."
        - area: history_fidelity_probe_map
