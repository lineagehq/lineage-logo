# GoalBuddy v2 state.yaml
version: 2

goal:
  title: "Agent-to-Canvas Integration"
  slug: "agent-canvas-integration"
  kind: existing_plan
  tranche: "Complete the local agent-to-canvas MVP through successive safe verified vertical slices."
  status: done
  oracle:
    signal: "A fixture-backed real-browser workflow proves live agent layer changes, accurate review, accept/revert, coherent undo/redo, and clean faithful export without reload."
    cadence: "after each Worker package and at final audit"
    final_proof: "Automated contract/history/fidelity/integration gates plus a recorded browser walkthrough and final Judge mapping with full_outcome_complete: true."
  intake:
    original_request: "Create a detailed GoalBuddy Prep plan to implement the agreed agent-to-canvas workflow."
    interpreted_outcome: "Connect agent-generated SVG operations to the open correction canvas with live transactional application, human review, reversible history, skill integration, and clean export."
    input_shape: existing_plan
    audience: "Logo designers using lineage-logo with an agentic logo-generation workflow"
    authority: requested
    proof_type: demo
    completion_proof: "The full generate/load → live agent edit → review → accept/revert → undo/redo → manual refine → targeted agent adjustment → export/reopen flow passes in automation and a real browser."
    likely_misfire: "A nominal API or mocked demo that bypasses the real editor, harms SVG fidelity, trusts stale edits, fragments history, or needs reload."
    blind_spots_considered:
      - "Versioned command identity, idempotency, atomicity, ordering, acknowledgement, and errors"
      - "Stale-base conflicts between manual and agent edits"
      - "Trust, sanitization, unsupported SVG, and resource-reference integrity"
      - "Accept/revert versus undo/redo semantics and selection restoration"
      - "Transport disconnect/reconnect, duplicate delivery, payload limits, and accessibility"
      - "Clean serialization without protocol or review artifacts"
    existing_plan_facts:
      - "Define commands for adding and replacing SVG layers, renaming, reordering, setting paint, and selecting/focusing."
      - "Reflect logo-designer agent changes in the open canvas without reload."
      - "Preserve undo/redo across agent-authored changes."
      - "Show which layers the agent changed and allow accept or revert."
      - "Prove generate → manual refine → targeted agent adjustment → clean export end to end."
      - "Keep manual vector/path creation out of the MVP UI."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/agent-canvas-integration/"
    command: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/agent-canvas-integration"

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the user-provided MVP plan against the merged repository and turn any discovered constraints into exact implementation contracts and safe Worker boundaries."
    inputs:
      - "docs/goals/agent-canvas-integration/goal.md"
      - "README.md"
      - "package.json"
      - "Current main branch and merged manual-correction implementation"
    constraints:
      - "Read-only; do not implement."
      - "Preserve the existing-plan facts unless evidence shows a conflict."
      - "Identify product, protocol, security, fidelity, history, and transport risks with file-path evidence."
      - "Resolve whether the existing server/preview path can host the local agent transport before proposing new infrastructure."
    expected_output:
      - "Validated architecture and integration boundary"
      - "Command envelope and transaction semantics"
      - "Conflict, sanitization, and trust decisions"
      - "Exact allowed_files, verify, and stop_if refinements for T002-T006"
      - "Deferred and out-of-scope list"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "The merged manual editor has a viable local-first integration boundary: the existing loopback API can own authenticated ingress, delivery, acknowledgements, and idempotency; a strict shared protocol can validate transactions; and the client can stage changes on a detached SVG clone before committing through SvgEditor’s snapshot/history path. Sequential T002-T006 slices are safe with the refinements below. Two fidelity conflicts must be corrected: loading currently removes root width/height, and saving injects metadata#lineage-logo-edit, both contrary to the new clean-faithful-export oracle. Agent SVG must be rejected, never silently sanitized, when active/external content or reference damage is detected."
      evidence:
        - area: repository_state
          finding: "origin/main is ef24a00, merging 6581ced; HEAD is the merged feature commit and has an identical tree to origin/main. Local main is stale at d940ac5 but does not affect this read-only validation."
        - area: integration_boundary
          finding: "Use the existing loopback Node server, not new infrastructure. src/server/index.ts:15,100-153 already binds 127.0.0.1, owns /api routes, workspace scope, JSON parsing, CSP, and static production hosting; vite.config.ts:16-22 already proxies /api in development; scripts/dev.ts:32-58 already coordinates dynamic API/editor ports and lifecycle. Add transport within this boundary, factoring route/state logic into an importable server module."
        - area: editor_boundary
          finding: "Keep SvgEditor authoritative for the accepted document, selection, dirty state, and history. src/client/canvas/editor.ts:521-536 initializes the canonical SVG and session keys; 653-684 owns undo/redo/reset/clean serialization; 1023-1069 centralizes checkpoints and document notifications; 1304-1359 snapshots/restores markup, scope, primary selection, and multi-selection. Do not let transport or the adapter mutate DOM directly."
        - area: history_capability
          finding: "src/client/history/history.ts:1-38 stores opaque snapshots and already supports a transaction-sized checkpoint. A staged candidate can therefore remain outside history, acceptance can checkpoint once, and revert can discard without a history entry. Revision must be a separate monotonic concurrency token because restoring an older snapshot must not roll revision backward."
        - area: stable_targeting
          finding: "src/client/canvas/editor.ts:852-868 assigns unique session-only data-lineage-key values and serializeSvg strips data-lineage attributes at 127-158. Publish these keys in an authenticated current-document manifest and use them as transaction targets; never require persistent SVG IDs and never export keys."
        - area: command_contract
          finding: "Protocol v1 envelope: {protocolVersion:1, transactionId, producer:{kind,name,version?}, document:{sessionId,sourcePath,baseRevision}, operations:[...]}. Require strict fields, transaction/operation IDs of bounded length, 1-100 operations, and <=5 MiB encoded payload. LayerRef is either {sessionKey} or {operationId} referencing an earlier structural operation. Operations are addLayer(parent,placement,svg), replaceLayer(target,svg), renameLayer(target,name|null), reorderLayer(target,before|after sibling), setPaint(target,fill|stroke,value|null), and selectFocus(targets,primary?,scope?). Unknown versions, operations, fields, forward references, missing/ambiguous targets, invalid placement, and all-no-op mutating transactions are structured rejections."
        - area: atomicity_and_results
          finding: "Parse and apply operations sequentially to a detached clone of the current accepted SVG. Each structural operation yields a transaction-local result reference. Validate the complete candidate, IDs, local references, locks, resulting selection, and byte limit before exposing a preview. Any failure discards the clone and returns {transactionId,status:'rejected',error:{code,message,operationId?,path?}} with no document, selection, revision, dirty, or history mutation. Success returns an impact manifest keyed by operationId and affected session keys. Mutating transactions become pending_review; navigation-only selectFocus transactions may apply immediately without revision/history."
        - area: revision_and_review_semantics
          finding: "Each file load creates a new document sessionId at revision 0. Every canonical manual mutation, accepted agent transaction, undo, redo, or content-changing reset increments revision monotonically once; preview/revert/navigation do not. Delivery must match sessionId, sourcePath, and exact baseRevision at the client. Permit only one pending mutating transaction; freeze document-mutating controls while pending. Accept checkpoints the pre-accept editor snapshot once, commits the whole candidate, applies requested focus, marks dirty, and increments revision once. Revert discards preview, restores exact pre-preview context, creates no history entry, and leaves revision/dirty unchanged. Undo after accept restores the pre-accept SVG and selection and increments revision; redo likewise."
        - area: idempotency_and_transport
          finding: "Use POST /api/agent/transactions for bearer-authenticated producer submission, GET /api/agent/document for the authenticated current manifest, GET /api/agent/events as the same-origin SSE stream, browser acknowledgement/state endpoints protected by exact editor origin, and authenticated GET status for producers. Store transactionId plus payload hash and lifecycle state in a bounded in-memory registry. Exact duplicates return prior status without delivery; same ID with different bytes returns id_conflict. SSE uses monotonic event IDs, Last-Event-ID replay, heartbeat, a bounded backlog, 15-second delivery/staging timeout, and terminal states pending_review/accepted/reverted/rejected/stale/disconnected. Reconnect may resume undelivered events but must never redeliver terminal/applied transactions."
        - area: trust_and_sanitization
          finding: "Generate a high-entropy bearer token at local server startup or accept an explicit environment/CLI token; print it for the adapter, never place it in URLs or browser state, compare it safely, bind only loopback, require application/json, and emit no CORS allowance. Browser stream/ack routes require the dynamically configured editor origin; vite.config.ts:20 must stop hard-coding port 5173. Treat all agent SVG as untrusted. Parse as SVG XML and reject the entire transaction for parser errors, multiple fragment roots, script, foreignObject, SMIL animation, event handlers, style elements/attributes in the MVP, external href/src/url, unsupported namespaces, or over-limit content. Never strip or normalize rejected content silently."
        - area: reference_integrity
          finding: "For add/replace, require exactly one selectable top-level layer, while allowing safe unsupported descendants/resources to round-trip. Newly introduced IDs must not create collisions; newly introduced #references must resolve exactly once in the candidate; replacing/removing IDs referenced outside the targeted subtree is rejected unless the replacement preserves those IDs. Existing untouched duplicate IDs or unsupported constructs are preserved rather than globally rewritten. setPaint accepts null/inherited or validated SVG paint and permits url(#id) only when the local target resolves exactly once. Locked targets or descendants are rejected; hidden targets may be staged and must remain locatable in review."
        - area: fidelity_conflict
          finding: "src/client/main.ts:478-482 removes source width and height before editor.load, so clean saves lose explicit root attributes. T004 must preserve them and use CSS/layout-only sizing. src/server/workspace.ts:92,113-123 injects metadata#lineage-logo-edit, README.md:94-95 promises it, and tests/workspace.test.ts:86-89 requires it; the newer goal explicitly forbids editor metadata. T004 must remove this injection, strip legacy reserved lineage-logo metadata on clean save, update README/tests, and preserve all unrelated source metadata."
        - area: T002_refinement
          finding: "Objective: deliver the strict v1 schema and detached-clone atomic evaluator, plus a minimal SvgEditor validation/staging hook without transport or review UI. allowed_files: src/shared/agent-protocol.ts, src/client/agent/transaction.ts, src/client/canvas/editor.ts, tests/agent-protocol.test.ts, tests/agent-transaction.test.ts, tests/editor-serialization.test.ts, tests/fidelity.test.ts, README.md, package.json, package-lock.json. verify: npm run typecheck; npm run test; npm run build; git diff --check. stop_if: candidate application cannot remain detached/atomic; safe fragment validation would require silently dropping content; target/reference integrity cannot be proven; files outside this list are required. Tests must cover every operation, operation references, unknown version/op/field, malformed and oversized payloads, locked/ambiguous/missing targets, invalid SVG, active/external content, ID/reference breakage, no-op rejection, rollback after a late-operation failure, and preservation of untouched unsupported content."
        - area: T003_refinement
          finding: "Objective: deliver authenticated local producer ingress, current-document manifest synchronization, SSE delivery, acknowledgements/status, reconnect, dedupe, and no-reload staging through the T002 API. allowed_files: src/server/index.ts, src/server/agent-transport.ts, src/server/http.ts, src/shared/agent-protocol.ts, src/client/agent/transport.ts, src/client/main.ts, scripts/dev.ts, vite.config.ts, tests/agent-transport.test.ts, tests/workspace.test.ts, README.md, package.json, package-lock.json. verify: npm run check; npm audit --audit-level=high; git diff --check; automated real-HTTP smoke covering token/origin failures, ordering, same/different-payload duplicate IDs, Last-Event-ID reconnect, timeout/backlog/payload limits, disconnect, and browser acknowledgement; run launcher with default API and editor ports occupied and verify selected ports plus child cleanup. stop_if: deterministic ack/order or dynamic-origin enforcement cannot be achieved; secret must enter URL/browser state; delivery bypasses T002; files outside the list are required."
        - area: T004_refinement
          finding: "Objective: integrate pending candidate, accept/revert, monotonic revision, locks, selection/focus restoration, and transaction-sized history; repair full save/reopen fidelity. allowed_files: src/client/canvas/editor.ts, src/client/agent/transaction.ts, src/client/agent/session.ts, src/client/history/history.ts, src/client/main.ts, src/shared/agent-protocol.ts, src/server/workspace.ts, tests/agent-history.test.ts, tests/editor-serialization.test.ts, tests/fidelity.test.ts, tests/history.test.ts, tests/workspace.test.ts, tests/fixtures/**, README.md. verify: npm run check; git diff --check; focused history tests proving failed/reverted transactions create no checkpoint, accept creates exactly one, undo/redo restore SVG/hierarchy/scope/multi-selection while revision remains monotonic; structural save/reopen comparisons for root width/height, IDs/references, defs/gradients, transforms, text, style-bearing untouched source, use/symbol, custom attributes, and unsupported safe elements; assert no data-lineage, agent/review/transport attributes, or metadata#lineage-logo-edit in export. stop_if: preview touches canonical/export state before accept; revision can roll backward; any untargeted source loss/reference break occurs; clean-export conflict remains unresolved; files outside the list are required."
        - area: T005_refinement
          finding: "Objective: build one accessible pending-review mode over the isolated candidate, with accurate transaction/per-layer impact, preview toggle, focus navigation, Accept all, and Revert. allowed_files: src/client/main.ts, src/client/styles.css, src/client/index.html, src/client/canvas/editor.ts, src/client/agent/transaction.ts, src/client/agent/transport.ts, src/client/agent/review.ts, tests/agent-review.test.ts, tests/editor-serialization.test.ts, README.md. verify: npm run check; git diff --check; browser QA at 1280x720 and 980x720 with no clipped core actions; keyboard-only and screen-reader-name/state/live-region walkthrough; clean console; preview-versus-export assertion; nested, hidden, locked, and multi-selected fixtures; pending, accepted, reverted, failed, stale, and disconnected states. stop_if: preview cannot remain isolated; manual mutation is possible while pending; impacted layers cannot be located in both canvas and hierarchy; accept/revert semantics diverge from T004; files outside the list are required."
        - area: T006_refinement
          finding: "Objective: inspect the external logo-designer skill only now, implement a thin CLI adapter that reads its produced SVG/artifact and submits the exact public v1 protocol, and prove the complete oracle through the real server, stream, editor, and review UI. allowed_files: src/**, scripts/logo-designer-adapter.ts, scripts/**, tests/**, fixtures/**, docs/agent-canvas.md, docs/oracle/**, README.md, package.json, package-lock.json, vite.config.ts. verify: npm run check; npm audit --audit-level=high; git diff --check; adapter invocation against the running authenticated API; automated end-to-end test through real HTTP/SSE and editor transaction API; real-browser generate/load -> live add/replace -> review -> revert -> resend/accept -> undo/redo -> manual refine -> targeted adjustment -> accept -> save -> reopen walkthrough with clean console; structural compare and hash the exported artifact, proving explicit deltas only and no lineage/agent/review/transport metadata. stop_if: external skill cannot be adapted without modifying/publishing its repository; adapter imports editor internals or bypasses public transport; oracle uses mocked delivery/application; representative simple, nested, transformed, gradient, text, and unsupported-safe fixtures fail; files outside the list are required."
        - area: deferred_out_of_scope
          finding: "Defer hosted/remote transport, multi-user or multi-editor concurrency, durable transaction persistence across server restarts, CRDT/merge conflict resolution, cryptographic signing beyond the local bearer, partial/per-operation acceptance, arbitrary CSS/style/animation authoring, manual path/freehand creation, publishing or modifying the external skill, and production credentials. The MVP accepts/reverts an entire atomic transaction only."
      parallel_safety:
        safe: false
        reason: "T002-T006 are dependency-ordered vertical slices and intentionally overlap src/client/canvas/editor.ts, src/client/main.ts, shared protocol types, and tests. Parallel Workers would race contracts and history/review semantics; execute sequentially."
      missing_evidence:
