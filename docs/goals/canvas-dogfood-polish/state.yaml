      facts:
        - "Review contract — A staged BleepThat transaction must reattach after reload with identical candidate/impact and one decision path, or reach a prompt explicit terminal state. Browser/server/producer must converge without duplicate history or application. Pending UI must say ‘Accept or revert before editing,’ focus an actionable control, and restore editing/focus after decision."
