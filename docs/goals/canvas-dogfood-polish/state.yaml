version: 2

goal:
  title: "Canvas Dogfood Polish"
  slug: "canvas-dogfood-polish"
  kind: existing_plan
  tranche: "Complete the agreed post-BleepThat dogfood correctness and UX tranche through verified vertical slices."
  status: done
  oracle:
    signal: "A real BleepThat skill proposal survives pending-review reconnect, is accepted and manually refined, then saves, reopens, and continues from the exact clean SVG while responsive/accessibility checks pass."
    cadence: "after each Worker package and at final audit"
    final_proof: "Passing automated suite plus recorded browser walkthrough at 1440/1024/980/760 widths and a real skill-to-canvas reconnect/accept/edit/save/reopen continuation receipt."
  intake:
    original_request: "Implement the agreed manual-QA improvements, including independently collapsible animated sidebars."
    interpreted_outcome: "A resilient, responsive manual SVG correction canvas proven by a real BleepThat dogfood loop."
    input_shape: existing_plan
    audience: "logo designers using Lineage directly or through the logo-designer skill"
    authority: approved
    proof_type: demo
    completion_proof: "Every scoped contract passes automated checks and the end-to-end BleepThat oracle."
    likely_misfire: "Polish the canvas shell while review reconnect or grouped SVG transform fidelity remains unreliable."
    blind_spots_considered:
      - "Proposal replay, deduplication, and terminal-state convergence after reconnect"
      - "Review-lock explanation and pending-state discoverability"
      - "SVG hierarchy, unsupported attributes, references, serialization cleanliness, and exact undo"
      - "Keyboard access, focus restoration, reduced motion, narrow-window overflow, and preference persistence"
      - "Safe text editing and meaningful 16/32/64 px preview targeting"
    existing_plan_facts:
      - "Correctness work precedes visual polish."
      - "Left and right sidebars collapse independently into slim rails and persist preferences."
      - "The canvas recenters smoothly without mutating document state."
      - "Pending review auto-reveals the right panel and shows a badge when collapsed."
      - "Native unsaved confirmation is replaced by Save / Discard / Cancel."
      - "Group transforms, bounded text controls, and icon-targeted previews are in scope."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

