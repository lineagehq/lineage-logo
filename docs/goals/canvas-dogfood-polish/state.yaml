        - "Responsive/dialog contract — Independent roughly 200ms left/right rails with visible aria-expanded toggles, shortcuts, persisted preferences, reduced-motion support, safe auto-collapse, and pending-review reveal/badge. All essential controls remain reachable at 1440/1024/980/760. Layout changes preserve SVG, dirty/history, selection, and zoom."
