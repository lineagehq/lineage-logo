        - "Responsive/dialog files — src/client/main.ts; styles.css; index.html; file-open.ts; optional src/client/ui/layout.ts and src/client/ui/unsaved-dialog.ts; tests/file-open-race.test.ts; new tests/client-ux.test.ts; README.md."
        - "Group-transform contract — Each gesture composes one bounded-precision transform on the selected group root only; descendants, hierarchy, attributes, IDs, and references remain unchanged. One undo/redo checkpoint restores exact before/after clean SVG; save/reopen is stable."
        - "Group-transform files — src/client/canvas/editor.ts; optional src/client/canvas/transform.ts; new tests/editor-interactions.test.ts; editor-serialization, fidelity, and history tests."
        - "Text/preview contract — Support validated text content, font size, weight, family, alignment/text-anchor, and letter spacing with one checkpoint, cancel, undo/redo, and safe serialization. Preview defaults to valid #icon, permits explicit target, visibly falls back, preserves referenced resources, and never mutates editor state."
        - "Text/preview files — src/client/main.ts; styles.css; canvas/editor.ts; optional src/client/preview.ts; editor-serialization, fidelity, and client-ux tests; README.md."
        - "Inspector contract — Collapsed selection-relevant inspector groups should expose concise current-value/status summaries without overriding ordinary user disclosure choices."
