# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Marquee Preview Browser QA Automation"
  slug: "marquee-preview-e2e-qa"
  kind: existing_plan
  tranche: "Turn the agreed marquee-preview QA design into deterministic repo-owned Chromium automation and a required CI proof without changing product behavior beyond testability seams."
  status: active
  oracle:
    signal: "A clean-checkout Playwright run uses real left-Control and pointer input on the complex Seatify fixture to prove live preview entry/exit, preview-to-commit parity, additive and canceled gestures, both hit modes, layout variants, and zero document/history mutation before commit."
    cadence: "after each Worker package and at final audit"
    final_proof: "Green unit/build checks, green browser QA including ten repeated runs, a green dedicated CI job, failure-only diagnostics, and a final Judge receipt with full_outcome_complete: true."
  intake:
    original_request: "Plan implementation of automated marquee-preview QA using GoalBuddy Prep."
    interpreted_outcome: "The repository owns reliable browser automation that proves the marquee preview behaves exactly like the final selection under real keyboard and pointer input."
    input_shape: existing_plan
    audience: "Lineage Logo maintainers and users relying on marquee selection"
    authority: requested
    proof_type: test
    completion_proof: "The complete browser scenario matrix passes repeatedly and in CI without repository mutation or timing flakes."
    likely_misfire: "Produce method-level tests or screenshot-only coverage that never holds physical ControlLeft through a real pointer drag, or add a flaky browser suite that appears green while preview and commit can diverge."
    blind_spots_considered:
      - "Deterministic dev-server ports, descriptive .localhost origin, readiness, shutdown, and exact temporary-workspace cleanup."
      - "Stable geometry-derived input rather than hard-coded pixels or sleep-based timing."
      - "Transient preview identity, Layers parity, hit-mode preferences, zoom, collapsed sidebars, pointer capture, and Escape cancellation."
      - "No dirty state, history checkpoint, Save/Reset enablement, inspector churn, or serialized SVG mutation during preview."
      - "Failure-only traces/screenshots, CI browser dependencies, runtime budget, repeat-run flake proof, and clean-checkout reproducibility."
    existing_plan_facts:
      - "Use Playwright with Chromium only for the MVP."
      - "Run against the existing complex Seatify fixture through a temporary workspace."
      - "Use real left-Control keyboard state and real pointer movement."
      - "Prefer DOM/state assertions; use one focused visual assertion only as secondary proof."
      - "Cover live entry/exit, commit parity, Shift additive, Escape, contain/touch, zoom, collapsed sidebars, and non-mutation."
      - "Keep the existing fast check and add a separate browser QA CI job."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/marquee-preview-e2e-qa/"
    command: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/marquee-preview-e2e-qa"

