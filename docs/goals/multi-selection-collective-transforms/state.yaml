          behavior_contract: "Show collective controls only when at least two distinct selected nodes pass one all-or-nothing collectiveTransformAvailability preflight. Preserve the existing single-selection plugin path unchanged.,At gesture start, compute each member's finite rootBox and the tight axis-aligned union in root user coordinates. Reject zero-width, zero-height, non-finite, disconnected, or unsupported geometry before capturing or mutating authored state.,Freeze the gesture-start union, its center pivot, every member's original transform attribute, initial local matrix, and parent-to-root matrix. Never recompute member inputs cumulatively during a gesture.,Create one editor-only selection-owned overlay with an outline, eight shared resize handles, a top-center connector, and the existing recognizable rotation icon. Do not attach shared handles to the primary member and do not wrap, reparent, reorder, or rename selected SVG nodes.,Keep all selected-member violet halos and Layers selection feedback visible. Keep the existing deterministic primary identity visually distinguishable and unchanged throughout preview, commit, Undo, Redo, and save/reload.,Shared resize is uniformly aspect-preserving without a modifier, matching current single-selection behavior. aroundCenter remains false. Each handle uses its opposite handle as the fixed root-space anchor; edge handles derive the factor from their dragged axis and corner handles use max(scaleX, scaleY). Use grid-1 root-coordinate snapping, positive bounded scale only, and no mirroring.,Shift, Alt, Control, Meta, and platform selection accelerators do not introduce new resize or rotation modes. Existing selection and canvas shortcuts remain unchanged; modifier-based aspect toggling or center scaling is deferred.,Shared rotation uses the frozen root-union center as pivot. Derive the delta from root-space start/current pointer vectors, snap the resulting delta to 1-degree increments, and apply one rotation around that fixed pivot to every member.,During resize, update the shared box and handles from the scaled frozen union. During rotation, rotate the frozen box, connector, handle, and member halos rigidly around the same pivot rather than recomputing an axis-aligned box each frame. After commit or restore, rebase the displayed box to the current tight root-space union.,For a collective root transform C, set each member from immutable gesture-start data using inverse(parentToRoot) × C × parentToRoot × initialLocalTransform. Scaling uses T(anchor) × S(factor) × T(-anchor); rotation uses T(pivot) × R(delta) × T(-pivot). Reject the entire gesture if any inversion, coefficient bound, or transform write cannot be completed safely.,Use a 3-screen-pixel activation threshold consistent with collective movement. Zero-distance, below-threshold, invalid-pivot, and exact-snapshot no-op gestures restore every original transform attribute byte-for-byte and add no history.,Only shared-overlay handles initiate collective resize or rotation. Dragging any selected member remains collective translation; pointer activity on an overlay handle must not toggle selection, change the primary, or start member drag.,Reuse the collective movement safety policy: reject all selected members if agent review is pending, any member is locked through its ancestry, hidden through its ancestry, disconnected, unsupported, ancestor/descendant-overlapping, CSS-transform-controlled, or lacks valid root/parent geometry. A gate that begins mid-gesture cancels and exactly restores the whole selection.,Resource-backed selectable leaves remain eligible when every normal precondition passes because the editor-owned overlay only composes the selected node's transform attribute; do not invoke the primary svg.resize mutation path on them.,Escape, pointercancel, lost pointer capture, touch cancellation, and explicit rejection cancel the entire gesture, restore original transform syntax and selection identity, and create zero history actions.,A changed pointer gesture captures one before snapshot and creates exactly one checkpoint. Undo restores exact before geometry and syntax; Redo restores exact after geometry; save/reload preserves the same root geometry and selected-node identities where the existing history/selection contract supports restoration.,The shared overlay, handles, auras, accessibility metadata, preferences, test identifiers, and transient gesture state must be absent from serialized SVG. Only intended transform attributes on authored selected nodes may change.,Reuse existing handle cursor, focus, label, rotation hit-target, keyboard-cancellation, zoom, and reduced-motion conventions. Collective controls must remain legible and operable at 100% and 125% zoom with either sidebar collapsed.,Focused Chromium coverage must select at least three labeled complex Seatify objects including nested and cross-parent members, vary which member is primary, and exercise shared resize and rotation through public pointer UI with exact root-space assertions."
