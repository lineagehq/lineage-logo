      result: done
      summary: "Mapped the collective-transform architecture and proof surfaces. Current multi-selection uses primary-only resize/rotation handles, while collective movement already provides the correct all-or-nothing eligibility, cross-parent root-space conversion, atomic snapshot history, cancellation, and browser-test patterns. The safest vertical slice is a root-space CollectiveTransformGesture plus a shared editor-only union overlay, integrated into the existing interactive lifecycle and covered by focused unit and Chromium tests on the complex Seatify fixture."
      evidence:
        - file: src/client/canvas/editor.ts
          symbols: "SvgEditor.#setSelection,SvgEditor.#beginInteractiveMutation,SvgEditor.#finishInteractiveMutation,SvgEditor.#cancelInteractiveMutation"
          finding: "Only the primary SvgElement receives svg.resize handles; multi-selection installs drag sources on all eligible members. Interactive mutations already capture one pre-gesture snapshot, checkpoint once on commit, and restore on cancellation."
        - file: src/client/canvas/editor.ts
          symbols: "translationAvailability,translationTargets,parentToRootMatrix,rootBox"
          finding: "Collective movement rejects disconnected, hidden, CSS-transform-controlled, locked, ancestor/descendant, and agent-blocked selections before mutation and derives each member's parent-to-root matrix independently."
        - file: src/client/canvas/transform.ts
          symbols: "relativeMatrix,SelectionTranslationGesture,composeGroupResize,GroupTransformGesture"
          finding: "Matrix normalization, inversion, bounded coefficients, exact original-transform restoration, and gesture completion semantics are reusable. GroupTransformGesture is single-element/local-box only and is not sufficient for cross-parent collective transforms."
        - file: src/client/canvas/editor.ts
          symbols: "SvgEditor.#renderSelectionHalos,enhanceRotationHandle,serializeSvg"
          finding: "Per-member violet halos are root-space editor overlays, while resize/rotation handles come from the selected primary. Serialization strips selection overlays, handle nodes, data-lineage attributes, and other editor state."
        - file: src/client/history/history.ts
          symbols: "History.checkpoint,History.undo,History.redo"
          finding: "History stores serialized snapshots; one checkpoint of the before snapshot is sufficient for an atomic multi-member gesture."
        - file: tests/editor-interactions.test.ts
          finding: "Existing deterministic tests cover parent/root matrix conversion, bounded composition, exact cancel/no-op syntax restoration, collective cross-parent movement, lock/hidden/disconnected/CSS/agent rejection, rotation affordance, and atomic Undo/Redo."
        - file: tests/e2e/collective-translation.spec.ts
          finding: "Real Chromium helpers already exercise labeled cross-parent selection, non-primary gesture initiation, exact root geometry, threshold/Escape paths, rejection, public Agent review, named Save, and SVG cleanliness."
        - file: tests/e2e/multi-selection-arrangement.spec.ts
          finding: "Browser coverage supplies 125% zoom, collapsed-sidebars, identity continuity, exact arrangement geometry, rejection precedence, and authored-structure fidelity patterns."
