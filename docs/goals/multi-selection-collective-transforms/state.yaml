version: 2

goal:
  title: "Collective Multi-Selection Transforms"
  slug: "multi-selection-collective-transforms"
  kind: specific
  tranche: "Implement, dogfood, and rigorously verify shared resize and rotation for multi-selected SVG objects."
  status: done
  oracle:
    signal: "On the complex Seatify fixture, a user can select three or more eligible nested and cross-parent objects and use one shared transform box to resize or rotate them as a coherent temporary group, with exact atomic Undo/Redo and no SVG contamination."
    cadence: "after each Worker package and at final audit"
    final_proof: "Receipt-backed unit, build, focused Chromium, repeated exact-geometry, and adversarial local dogfood evidence mapped to every required interaction and safety case."
  intake:
    original_request: "Agreed. Let's continue with that now."
    interpreted_outcome: "Add production-ready collective resize and rotation to the existing multi-selection workflow."
    input_shape: specific
    audience: "People manually correcting layered SVG logos in the Lineage Logo canvas"
    authority: approved
    proof_type: test
    completion_proof: "The exact oracle passes on a clean checkout, the shared transform UI is manually usable, and a final audit records full_outcome_complete: true."
    likely_misfire: "Rendering a shared box or transforming only the primary object while failing to preserve cross-parent geometry, history atomicity, selection identity, or clean authored SVG."
    blind_spots_considered:
      - "Cross-parent coordinate conversion and rotated or transformed ancestors"
      - "Union bounds, pivot semantics, handle hit targets, and modifier behavior"
      - "Selection feedback versus primary-object feedback"
      - "Pointer cancellation, below-threshold movement, and no-op history"
      - "Locked, hidden, disconnected, ineligible, and agent-review gates"
      - "Zoom, collapsed sidebars, serialization, and authored-SVG cleanliness"
    existing_plan_facts:
      - "Build on the merged marquee selection and collective movement foundation."
      - "Use one shared union transform box for multi-selection resize and rotation."
      - "Preserve relative layout and produce one atomic Undo/Redo checkpoint per gesture."
      - "Use the complex Seatify logo as the primary dogfood fixture."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

