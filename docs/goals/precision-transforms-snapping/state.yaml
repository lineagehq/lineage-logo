        - "Which coordinate spaces are used for pointer input, zoom, SVG/viewBox geometry, object bounds, collective oriented bounds, resize handles, nested transforms, and mixed-parent selections; where are conversions performed?"
        - "How are authored transform lists composed and preserved today, and which operations risk flattening, reordering, or drifting rotated/nested geometry?"
        - "Where are eligible snap targets enumerated, and how are hidden, locked, selected, nested, incompatible-parent, defs/editor-only, and agent-pending objects represented or excluded?"
        - "What existing preference storage, settings UI, inspector-field, keyboard-modifier, accessibility, and sidebar patterns should snapping and numeric controls extend?"
        - "Where are gesture start/commit/cancel/no-op and numeric edit commit/cancel boundaries connected to Undo/Redo, Reset, agent acceptance, and rollback?"
        - "What exact serialization and agent-submission paths strip editor-only overlays/state, and which tests prove saved SVG structure remains clean?"
        - "Which checked-in files and helpers load the complex Seatify constellation, select stable object sets, drive multi-selection transforms, change zoom/collapse sidebars, save/reload, and inspect geometry/guides?"
        - "What repository commands provide focused interaction, serialization, Seatify E2E, complete check, build, and full Chromium verification; are any currently red or flaky?"
