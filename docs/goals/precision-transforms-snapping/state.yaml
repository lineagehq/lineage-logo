      - "Ambiguities requiring evidence"
      - "Targeted Scout questions"
      - "Risks that must shape Worker verification"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "The plan faithfully preserves the approved outcome and correctly defers Group/Ungroup, pivots, grids/rulers, structural normalization, and PR work. Its two vertical slices are appropriately outcome-sized, but implementation is unsafe until Scout evidence establishes the editor's actual coordinate spaces, transform composition, selection compatibility rules, history boundaries, serialization path, preferences/inspector patterns, and real Seatify test harness. T002 should collect symbol-level evidence and current verification commands; T003 must then resolve the remaining UX and geometry semantics before authorizing a Worker package."
