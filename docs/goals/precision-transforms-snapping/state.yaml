  - id: T002
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low
    objective: "Map the current transform, selection, preferences, history, serialization, and E2E architecture needed to implement precision transforms safely."
    inputs:
      - "T001 receipt"
      - "Current client editor and styling sources"
      - "Current interaction, serialization, and Playwright tests"
      - "Existing complex Seatify fixture and rotation-feedback QA"
    constraints:
      - "Read-only."
      - "Keep searches inside the repository boundary and follow AGENTS.md."
      - "Trace actual coordinate spaces and event paths; do not infer from UI appearance alone."
      - "Identify existing preference and inspector patterns that can be extended instead of duplicated."
    expected_output:
      - "File-and-symbol map for translate, resize, rotate, collective selection, inspector, preferences, history, and save/agent paths"
      - "Current coordinate-space and transform-composition model"
      - "Existing test fixtures/helpers and exact verification commands"
      - "Compatibility hazards and candidate allowed_files for each implementation slice"
      - "Pre-existing red or flaky checks, if any"
    receipt:
      result: done
      summary: "Mapped the editor architecture and verified the current transform model. Direct manipulation is centralized in SvgEditor, with reusable matrix/gesture primitives in transform.ts, persisted selection settings, snapshot-based atomic history, and clean clone-based serialization. The Seatify fixture and existing interaction/E2E suites provide strong reusable coverage. Main hazards are two separate single-versus-collective event paths, screen/root/oriented/local coordinate conversions, authored transform replacement with matrix attributes, incomplete multi-selection inspector semantics, CSS-transform rejection, and editor overlays living inside the SVG. The repository check was started from a worktree whose only visible untracked content was the GoalBuddy plan; typecheck passed and Vitest began, but terminal completion was not observed within the bounded Scout command budget."
      evidence:
        - path: src/client/canvas/editor.ts
          symbols: "SvgEditor.#setSelection,#bindSelectionDragSource,#beginInteractiveMutation,#finishInteractiveMutation,#cancelInteractiveMutation,#renderCollectiveTransformOverlay,#bindCollectiveHandle,#moveCollectiveTransform,#moveSelection,#scaleSelection,#rotateSelection,#snapshot,#restore,serializeSvg"
          detail: "Owns selection installation, plugin and pointer lifecycle, direct transforms, inspector edits, history boundaries, agent blocking, overlay rendering, snapshot restoration, and clean serialization."
        - path: src/client/canvas/transform.ts
          symbols: "transformVectorToLocal,transformPointToLocal,composeRootTranslation,SelectionTranslationGesture,collectiveScaleMatrix,collectiveRotationMatrix,composeCollectiveRootTransform,CollectiveTransformGesture,GroupTransformGesture"
          detail: "Provides bounded affine-matrix composition and cancel/complete semantics for root-space translation, collective transforms across parents, and group transforms."
        - path: src/client/selection-preferences.ts
          symbols: "SelectionPreferences,SelectionPreferencesStore,DEFAULT_SELECTION_PREFERENCES,SELECTION_PREFERENCES_STORAGE_KEY"
          detail: "Versioned localStorage-backed settings pattern with strict schema parsing, legacy migration, defaults, reset, and in-memory fallback."
        - path: src/client/main.ts
          symbols: "selection-preferences fieldset,position-x,position-y,scale,rotation,setZoom"
          detail: "Existing inspector exposes single-selection X/Y/Scale/Rotation; settings UI and sidebar/zoom controls are constructed here. Zoom is an artboard CSS scale."
        - path: src/client/history/history.ts
          symbols: "History.checkpoint,History.undo,History.redo,History.reset"
          detail: "Stores serialized editor snapshots; SvgEditor checkpoints the pre-gesture/pre-edit snapshot once and restores it atomically."
        - path: tests/editor-interactions.test.ts
          detail: "Covers coordinate conversion, matrix bounds, collective drag/resize/rotation, cancellation/no-op, history, locked/hidden/nested/CSS-transform rejection, agent replacement/rollback, keyboard controls, and a complete complex Seatify history sequence."
        - path: tests/editor-serialization.test.ts
          detail: "Proves selection halos and collective overlays are stripped from snapshots and clean saves, editor data is stripped only for clean output, and save/reopen preserves authored SVG."
        - path: tests/fixtures/workspace/concepts/complex-seatify.svg
          detail: "Checked-in principal complex fixture with nested and transformed venue-logo geometry."
        - path: tests/e2e/multi-selection-arrangement.spec.ts
          detail: "Reusable Seatify loader/helpers cover selection, geometry, history controls, agent pending/revert, 125% zoom, collapsed sidebars, named save, transform preservation, and editor-state leakage."
        - path: tests/e2e/rotation-feedback.spec.ts
          detail: "Real Seatify rotation QA selects stable labeled objects, drives the collective rotation handle, inspects CTMs/frame orientation and angle feedback, and verifies persistence."
        - path: playwright.config.ts
          detail: "Chromium-only deterministic E2E configuration uses one worker and a descriptive localhost origin."
      facts:
        - fact: "Pointer input begins in client/screen coordinates. screenMatrix(root) is inverted by transformPointToLocal for root-space points; screen deltas are converted with transformVectorToLocal. This naturally includes the artboard CSS zoom."
        - fact: "Each selected node retains its own parent coordinate space. translationTargets captures initial local matrix plus parent-to-root CTM; collective application computes inverse(parentToRoot) × collectiveRoot × parentToRoot × initial."
        - fact: "Collective rotated bounds are calculated in an oriented root space by applying the inverse cached collective rotation before unioning node getBBox geometry transformed through screen-derived relative matrices."
        - fact: "Collective resize currently rounds the oriented pointer to integer document coordinates and applies one uniform factor around the opposite handle anchor. Single resize/rotate is delegated to svg.resize.js; group resize is intercepted by GroupTransformGesture."
        - fact: "Shift is already available continuously on PointerEvent/keyboard events, but current collective pointer rotation rounds to whole degrees and does not inspect event.shiftKey. Single-object rotation is plugin-owned and needs a separate snapping integration strategy."
        - fact: "Eligibility is all-or-nothing through translationAvailability/collectiveTransformAvailability: disconnected, unsupported, hidden, locked, ancestor+descendant, CSS-transformed, singular/non-finite, and agent-blocked selections are rejected. Cross-parent selections are supported when coordinate spaces are invertible."
        - fact: "InspectorEditSession permits one checkpoint per focus session. X/Y use selected.rbox(drawing), scale/rotation use bbox pivots and data-lineage metadata; controls are disabled for multi-selection, so width/height and exact/mixed multi-selection semantics do not yet exist."
        - fact: "Editor overlays are appended inside the live SVG. serializeSvg clones and removes handle/halo/collective selectors; stripEditorState additionally removes lineage/agent/review/transport data and legacy metadata. Any new guide selector must be included in both snapshot and clean-save stripping."
        - fact: "Candidate snapping-and-guides allowed files: src/client/canvas/transform.ts, src/client/canvas/editor.ts, src/client/selection-preferences.ts, src/client/main.ts, src/client/styles.css, tests/editor-interactions.test.ts, tests/editor-serialization.test.ts, tests/selection-preferences.test.ts, tests/client-ux.test.ts, tests/e2e/rotation-feedback.spec.ts, tests/e2e/collective-translation.spec.ts, tests/e2e/collective-transforms.spec.ts, tests/e2e/multi-selection-arrangement.spec.ts."
        - fact: "Candidate numeric-controls allowed files: src/client/canvas/transform.ts, src/client/canvas/editor.ts, src/client/main.ts, src/client/styles.css, tests/editor-interactions.test.ts, tests/editor-serialization.test.ts, tests/client-ux.test.ts, tests/e2e/multi-selection-arrangement.spec.ts."
        - fact: "Exact verification commands: npm run typecheck; npx vitest run --config vitest.config.ts tests/editor-interactions.test.ts tests/editor-serialization.test.ts tests/selection-preferences.test.ts tests/client-ux.test.ts tests/complex-seatify-fixture.test.ts; npx playwright test tests/e2e/rotation-feedback.spec.ts tests/e2e/collective-translation.spec.ts tests/e2e/collective-transforms.spec.ts tests/e2e/multi-selection-arrangement.spec.ts --project=chromium; npm run check; npx playwright test --project=chromium."
      contradictions:
        - detail: "The desired numeric X/Y/width/height/rotation contract exceeds the existing inspector: width/height are absent, Scale is percent-based, and all transform fields are single-selection-only."
        - detail: "The desired free resize plus optional smart snapping conflicts with current collective resize's unconditional Math.round document-unit quantization."
        - detail: "Existing alignment permits only same-parent selections, while collective movement/transforms support compatible cross-parent selections; snap-target eligibility cannot simply reuse alignmentAvailability."
      ambiguity_requiring_judge:
        - detail: "Define whether X/Y and width/height refer to root-space axis-aligned visual bounds, the cached oriented collective frame, or an individual node's local bbox when rotated/nested."
        - detail: "Define object snap-target enumeration: selectable leaves versus logical groups, ancestor/descendant suppression, and whether targets under different transformed parents are eligible after projection to root space."
        - detail: "Define deterministic priority among canvas edges/centers and object edges/centers, independent-axis versus paired snaps, equal-distance tie-breaking, and whether selected objects are excluded collectively."
        - detail: "Define how Shift rotation snapping is integrated with svg.resize.js for single selection and whether keyboard collective rotation remains 1-degree steps or adopts 15-degree Shift steps."
        - detail: "Define the settings schema/version migration for global snapping enabled state, tolerance, object/canvas guide toggles, and temporary override modifier without colliding with Shift rotation or marquee Control-left."
        - detail: "Define whether numeric multi-selection rotation sets an absolute collective-frame angle or applies a delta to each object, and how mixed values are represented and committed."
      commands:
        - "git rev-parse --show-toplevel; rg --files <repo> -g AGENTS.md -g AGENTS.override.md"
        - "read AGENTS.md, state.yaml, and goal.md"
        - "rg --files src tests"
        - "targeted symbol search across editor, transform, inspector, preferences, and history"
        - "read transform gesture implementations and editor interaction lifecycle"
        - "search serialization, agent, inspector, collective overlay, and test symbols"
        - "read serialization, snapshot/restore, collective overlay/pointer math, and preferences storage"
        - "inspect package scripts, Playwright config, fixture/E2E/unit coverage"
        - "inspect main UI/styles, History, and availability rules"
        - "git status --short; npm run check"
        - "poll npm run check session twice"
      note_needed: false
      harness: codex
  - id: T003
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Turn the validated plan and repository evidence into an exact interaction, geometry, and verification contract, then specify the largest safe first Worker package."
    inputs:
      - "T001 receipt"
      - "T002 receipt"
      - "docs/goals/precision-transforms-snapping/goal.md"
    constraints:
      - "Read-only."
      - "Resolve semantics before implementation: modifier behavior, screen-pixel tolerance, candidates, priority, tie-breaking, guide rendering, rotated bounds, mixed values, validation, history, and serialization."
      - "Prefer one coherent snapping-and-guides vertical slice over helper-by-helper tasks."
      - "Do not expand scope into Group/Ungroup, rulers, grids, or transform normalization."
    expected_output:
      - "Normative UX and geometry contract with concrete examples"
      - "Decision on snapping enablement/preferences and temporary modifier overrides"
      - "Deterministic snap-candidate priority and tie-breaking rules"
      - "Exact first Worker objective, allowed_files, verify commands, and stop_if conditions"
      - "Deferred numeric-controls package contract"
      - "Oracle coverage matrix"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "T001 and T002 establish enough architectural evidence to authorize one coherent snapping-and-guides vertical slice. The contract keeps free transforms primary, uses a perceptually stable six-CSS-pixel tolerance, resolves deterministic candidates and ties in root space, preserves oriented resize/rotation behavior, and makes guides transient and truthful. Smart alignment is enabled by default with persisted canvas/object preferences; Alt/Option temporarily suspends snapping, while Shift activates absolute 15-degree rotation snapping. Numeric controls remain a second vertical slice because their rotated-frame, mixed-value, validation, and commit semantics require distinct inspector work. No subgoal or parallel Worker is justified because the central editor paths overlap."
      worker_package:
        objective: "Implement the complete snapping-and-live-guides vertical slice for eligible single and collective translation, resize, and rotation: persisted smart-alignment preferences, six-screen-pixel canvas/object snapping, Alt/Option temporary suspension, Shift-based absolute 15-degree rotation snapping, deterministic root-space candidate selection, rotated-selection-safe geometry, transient accessible guides that exactly match applied transforms, atomic history/cancel/no-op behavior, clean serialization, and focused plus real Seatify regression coverage."
        allowed_files:
          - src/client/canvas/transform.ts
          - src/client/canvas/editor.ts
          - src/client/selection-preferences.ts
          - src/client/main.ts
          - src/client/styles.css
          - tests/editor-interactions.test.ts
          - tests/editor-serialization.test.ts
          - tests/selection-preferences.test.ts
          - tests/client-ux.test.ts
          - tests/e2e/precision-snapping.spec.ts
          - tests/e2e/rotation-feedback.spec.ts
          - tests/e2e/collective-translation.spec.ts
          - tests/e2e/collective-transforms.spec.ts
          - tests/e2e/multi-selection-arrangement.spec.ts
        verify:
          - "git diff --check"
          - "npm run typecheck"
          - "npx vitest run --config vitest.config.ts tests/editor-interactions.test.ts tests/editor-serialization.test.ts tests/selection-preferences.test.ts tests/client-ux.test.ts tests/complex-seatify-fixture.test.ts"
          - "npx playwright test tests/e2e/precision-snapping.spec.ts tests/e2e/rotation-feedback.spec.ts tests/e2e/collective-translation.spec.ts tests/e2e/collective-transforms.spec.ts tests/e2e/multi-selection-arrangement.spec.ts --project=chromium"
          - "npm run check"
          - "npx playwright test --project=chromium"
        stop_if:
          - "Implementation requires any file outside allowed_files."
          - "Single-selection plugin integration cannot expose raw pointer geometry and modifier changes without vendoring a dependency, normalizing authored transforms, or creating a second conflicting gesture lifecycle."
          - "The current runtime cannot derive finite invertible root-to-screen geometry needed to measure tolerance in CSS pixels for an otherwise eligible selection."
          - "A proposed solution would snap only part of a selected set, admit hidden/locked/incompatible targets, or weaken existing all-or-nothing availability rules."
          - "Guide nodes or snap state cannot be excluded from snapshots, clean saves, and agent submissions through the existing serialization boundary."
          - "A required verify command fails twice for a cause outside allowed_files or reveals a contradictory interaction contract."
      evidence:
        - "Enablement: smart alignment for move and resize defaults ON. Persist alignmentSnappingEnabled=true, snapToCanvas=true, snapToObjects=true, and snapTolerancePx=6 through the existing versioned preferences pattern. Settings expose master, canvas/object toggles, and integer tolerance 2..20; invalid persisted values fall back to 6. Preference changes apply immediately and never create history."
        - "Modifiers: Alt/Option during a pointer gesture suspends every snap and guide; release resumes evaluation from the raw pointer without restarting. Control-left remains marquee. Shift only affects rotation, snapping absolute root-space frame angle to 15-degree multiples. Alt/Option plus Shift means free rotation. Modifier changes add no history."
        - "Tolerance: compare candidate correction along its screen-space normal against snapTolerancePx using the current root-to-screen matrix on every pointer move. At 125% zoom six pixels is 4.8 root units; at 50% it is 12. Do not round document coordinates before evaluation or application."
        - "Sources: translation uses left/center/right and top/middle/bottom from the post-raw-transform root-space AABB union. Rotated/nested nodes use transformed bbox corners. Non-uniform resize evaluates changed axes. Uniform resize derives candidate scales from both axes, applies one winner, and renders only satisfied alignments."
        - "Targets: canvas viewBox min/center/max; object anchors from outermost eligible selectable objects in root space. Exclude selected set plus ancestors/descendants, disconnected/editor-only/defs, hidden/locked, transform-ineligible, singular/non-finite nodes. Cross-parent targets are eligible when root projection is finite and invertible."
        - "Resolution: X and Y translation resolve independently. Lowest absolute CSS-pixel correction wins; ties within 0.001 use canvas center, object center, canvas edge, object edge, then document order, target min before max, and source center/min/max. Uniform resize uses smallest handle correction, same ranks, then X before Y; never combine incompatible scale factors."
        - "Rotation: normalize absolute visible frame orientation to [-180,180). Shift chooses nearest 15-degree multiple; exact 7.5 midpoint follows most recent nonzero drag direction, or away from zero if none. Single and collective rotation share semantics."
        - "Guides: only render applied winners. Canvas guides span viewBox; object guides span selection/target union plus 12 CSS pixels, clipped to artboard. Guides sit above artwork below handles, purple, one-CSS-pixel non-scaling dashed, pointer-events none, aria-hidden. A non-SVG polite status announces target changes."
        - "Guide state: metadata records axis, target family/anchor, source anchor, and target key. Clear when tolerance is exceeded, Option is held, preference disabled, gesture ends/cancels, selection unavailable, agent review starts, or document restores. Do not show incidental alignments."
        - "Rotated bounds: smart guides use actual post-transform root AABB. Collective resize retains cached oriented frame/opposite anchor; candidate scale is evaluated by applying the proposed oriented transform then measuring AABB. No flattening or normalization."
        - "History: one pointer-down owns one pre-mutation snapshot. Completed geometry change creates one checkpoint. Cancel, Escape, agent interruption, unavailable selection, or final no-op restores initial geometry and creates none. Preference changes are not history. Undo/Redo/Reset never restore transient guides."
        - "Serialization: candidate, target, modifier, status, and preferences are editor-only. Guide selectors are stripped from snapshots, clean saves, and agent SVG. Save persists only ordinary geometry; reload has no guide/preference/editor metadata."
        - "Move example: at 125% zoom a proposed center x=249.2 versus canvas x=250 needs one screen pixel, so canvas center wins over a two-pixel object edge; Option applies raw 249.2 and removes guide."
        - "Tie example: equal canvas/object centers choose canvas; equal object centers choose earlier document order; equal source center/edge chooses source center; X/Y independent."
        - "Resize example: oriented uniform scale candidates 1.240 on X and 1.245 on Y choose 1.240 by smaller handle correction, preserve opposite oriented corner, and render only X."
        - "Deferred numeric contract: X/Y/width/height/rotation describe an explicitly labeled oriented selection frame. X/Y are root coordinates of frame origin; dimensions are positive in frame; rotation normalized root angle. Single shows Exact; compatible multi shows aggregate plus Mixed members. Aggregate edits preserve relative geometry; unsupported selections disable rather than approximate."
        - "Deferred numeric validation: finite decimals only; X/Y in [-1000000,1000000], dimensions >0 and <=1000000, rotation normalized. Empty/malformed/non-finite/out-of-range preserves geometry with inline error. Display rounding does not round storage. Enter/blur commit one edit, Escape cancels, unchanged is no-op, and all targets preflight."
        - "Deferred sizing: width/height act in frame axes about opposite corner. Aspect lock defaults ON for collective selection; unlocked nonuniform scaling only when compatibility allows without normalization. Rotation is absolute frame angle applying one collective delta and preserving member differences."
        - "Deferred numeric scope: transform.ts, editor.ts, main.ts, styles.css, interaction/serialization/client UX tests, and Seatify E2E. Stop on normalization, partial mutation, or extra files."
        - "Oracle: preferences/client UX cover defaults, migration, invalid tolerance, settings, and Option discoverability; precision E2E covers live modifier transitions."
        - "Oracle: interaction tests cover pixel conversion across zoom, candidates/exclusions, cross-parent projection, rotated AABBs, independent axes, resize scoring, ties, cancel, and no-op."
        - "Oracle: interaction/serialization tests prove winning metadata/lifecycle and absence from snapshots, clean save, and agent submission; precision E2E matches guide coordinate to applied geometry."
        - "Oracle: rotation unit/E2E proves free and Shift-snapped single/collective rotation, midpoint, modifier changes, Option suspension, upright feedback, oriented frame, and atomic Undo/Redo."
        - "Oracle: real Seatify precision and arrangement E2E repeat move/resize/rotation at 125% with collapsed sidebars, save/reload, and agent-pending rejection; npm run check plus full Chromium cover regressions."
        - "Oracle deferred numeric: interaction/client UX cover exact/aggregate/mixed/unavailable, aspect lock, validation, commit/cancel, history, all-or-nothing; Seatify E2E covers fields, Undo/Redo, zoom/sidebar, and clean save/reload."
      parallel_safety:
        safe: false
        rationale: "Snapping geometry, gesture integration, guide lifecycle, preferences, serialization, and focused tests converge on SvgEditor and shared interaction suites. Disjoint write scopes are not provable."
      blocked_tasks: []
      missing_evidence: []
      required_board_updates:
        - "Record this receipt on T003 and mark T003 done."
        - "Activate T004 as sole active task."
        - "T004 must create one Worker card by copying worker_package exactly."
        - "Keep numeric controls deferred until snapping-and-guides passes."
