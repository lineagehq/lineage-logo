version: 2

goal:
  title: "Precision Transforms And Snapping"
  slug: "precision-transforms-snapping"
  kind: existing_plan
  tranche: "Validate semantics, implement snapping and guides, implement numeric precision controls, harden with Seatify QA, and reach a locally complete PR-ready state."
  status: blocked
  oracle:
    signal: "A deterministic Chromium workflow on the real Seatify constellation proves free and snapped transforms, truthful live guides, numeric edits, mixed-value behavior, atomic history, zoom/sidebar independence, and clean save/reload."
    cadence: "after each Worker package and at final audit"
    final_proof: "Passing repository checks and full browser suite, explicit Seatify E2E evidence, serialization evidence, and a final Judge receipt with full_outcome_complete: true."
  intake:
    original_request: "Plan precision transforms and snapping thoroughly."
    interpreted_outcome: "Deliver precise, discoverable snapping and numeric transform editing for single and multi-selection without regressing SVG integrity or existing canvas interactions."
    input_shape: existing_plan
    audience: "Logo-canvas users making manual corrections to generated SVG artwork."
    authority: requested
    proof_type: test
    completion_proof: "Automated and manual Seatify constellation QA proves the complete interaction contract and all existing verification remains green."
    likely_misfire: "Implementing visual guides or numeric controls that appear correct but diverge from exact transform geometry, zoom behavior, history, or serialization."
    blind_spots_considered:
      - "Screen-pixel snap tolerance across canvas zoom."
      - "Modifier conflicts and cross-platform keyboard semantics."
      - "Mixed-value numeric editing and invalid input."
      - "Rotated selections, nested transforms, and mixed-parent selections."
      - "Locked, hidden, and agent-pending all-or-nothing behavior."
      - "Undo/Redo atomicity, cancellation, no-op gestures, and clean SVG serialization."
      - "Guide priority, deterministic tie-breaking, visual occlusion, and accessibility."
    existing_plan_facts:
      - "Shift snaps rotation to 15-degree increments."
      - "Smart guides and snapping target canvas center/edges and nearby objects."
      - "Numeric X, Y, width, height, and rotation controls are required."
      - "Multi-selection must communicate exact versus mixed values."
      - "The complex Seatify constellation is the primary E2E fixture."
      - "Persistent Group/Ungroup is deferred to a later goal."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

