      evidence:
        - "Validated outcome: optional precision assistance for free and snapped single/multi move, resize, and rotation; numeric X/Y/width/height/rotation; truthful guides; mixed-value feedback; atomic history; zoom/sidebar independence; clean save/reload; real Seatify Chromium proof."
        - "Validated non-goals: persistent Group/Ungroup, arbitrary pivot editing, grids/rulers, structural SVG normalization, and PR creation/merge."
        - "The charter requires screen-pixel tolerance, deterministic canvas/object candidates and tie-breaking, live guides matching applied math, one checkpoint per completed gesture/edit, no checkpoint for cancel/no-op, and no editor-state serialization."
        - "T002 is the necessary evidence gate before T003 can safely define allowed_files or a Worker package."
      subgoal_contract: null
      parallel_safety:
        safe: false
