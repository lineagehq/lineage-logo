version: 2

goal:
  title: "Direct Logo-Designer Skill Integration"
  slug: "logo-designer-skill-integration"
  kind: existing_plan
  tranche: "Complete and prove the real local two-repository propose, review, decide, save, and continue loop."
  status: done
  oracle:
    signal: "A real logo-designer skill run submits a genuine SVG proposal to the active authenticated canvas, observes Accept and Revert, and continues from an accepted clean saved revision."
    cadence: "after each Worker package and at final audit"
    final_proof: "Receipt-backed automated checks in both repositories plus a recorded real browser/producer walkthrough and inspected clean SVG artifact."
  intake:
    original_request: "excellent - plan this out"
    interpreted_outcome: "Integrate the actual logo-designer skill with Lineage Logo's public protocol for a secure human-reviewed iteration loop."
    input_shape: existing_plan
    audience: "logo-designer skill users and maintainers of both repositories"
    authority: requested
    proof_type: demo
    completion_proof: "The documented real skill flow proves isolated proposal, terminal Accept/Revert, accepted-artifact continuation, security, fidelity, recovery, and green checks in both repositories."
    likely_misfire: "Delivering another wrapper or mock-only demo that does not connect the actual skill lifecycle to review and continued iteration."
    blind_spots_considered:
      - "Cross-repository ownership, instructions, branches, and verification commands."
      - "Token and active-session bootstrap without secret leakage."
      - "Authoritative artifact/revision ownership and producer waiting behavior."
      - "Crash, reconnect, stale, duplicate, unavailable-canvas, and terminal-decision recovery."
      - "Compatibility, versioning, install, and release boundaries."
      - "Per-operation approval and remote collaboration remain out of scope."
    existing_plan_facts:
      - "Package the current adapter logic as a reusable producer client."
      - "Securely target the active local canvas session."
      - "Submit proposals and wait for Accept or Revert."
      - "Return accepted SVG revisions to the skill iteration loop."
      - "Prove the flow across both repositories with a genuine generated logo."
      - "Document generate, review, correct, and continue."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

