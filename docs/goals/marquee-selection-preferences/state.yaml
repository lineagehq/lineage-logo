          gesture_precedence: "Transform handles and ordinary primary-button object drag retain existing behavior.,Middle-button drag or Space+primary drag pans from any stage location and never starts marquee.,Primary-button drag beginning on a non-selectable stage, artboard, or SVG-root pixel enters pending marquee; this includes surrounding stage padding.,Activate marquee after 4 CSS pixels of movement measured in client coordinates. Before activation, unmodified pointerup performs background-clear; Shift-pointerup is a no-op.,After activation, pointerup commits selection and suppresses the subsequent click. Escape, pointercancel, lostpointercapture, document replacement, or review lock cancels and restores the pre-gesture selection.,Configured exact-modifier primary pointer sequences over selectable objects are selection-only: they must not initiate drag or transform. Commit only below the movement threshold; cancel after movement."
