version: 2

goal:
  title: "Marquee selection and preferences"
  slug: marquee-selection-preferences
  kind: specific
  tranche: "Implement and battle-test marquee multi-selection, precise object toggling, individual selection feedback, and bounded persistent preferences."
  status: done
  oracle:
    signal: "A live complex Seatify walkthrough at 100% and non-default zoom proves correct marquee, additive and precise selection, pan coexistence, visible highlights, preference persistence, and clean history/serialization."
    cadence: "after each Worker package and at final audit"
    final_proof: "Automated interaction, serialization, accessibility, and persistence checks; browser QA transcript on the complex Seatify example; npm run check; final Judge audit."
  intake:
    original_request: "Plan drag selection, multi-object highlighting, precise-selection hotkeys, and settings."
    interpreted_outcome: "The canvas gains predictable professional selection mechanics and a small preferences surface without destabilizing existing editing gestures."
    input_shape: specific
    audience: "Lineage Logo users editing layered SVG marks"
    authority: requested
    proof_type: demo
    completion_proof: "The complete selection workflow passes automated verification and real-browser QA against the complex Seatify example."
    likely_misfire: "A marquee that appears to work at 100% zoom but selects incorrect nested nodes, steals pan, or dirties the document."
    blind_spots_considered:
      - "Zoom, viewBox, nested transforms, and screen-to-SVG coordinate conversion"
      - "Ancestor/descendant normalization and visual bounds"
      - "Platform-specific modifiers and legacy exact-selection behavior"
      - "Drag threshold, pointer capture/cancellation, focus, and reduced motion"
      - "Locked/hidden layers and canvas/layer-tree parity"
      - "Preference versioning, migration, and malformed local storage"
      - "Selection-only dirty state, undo history, and SVG serialization"
    existing_plan_facts:
      - "Shift-click already toggles selection."
      - "Alt-click and double-click already exact-select."
      - "Space-drag and middle-drag must remain pan gestures."
      - "Selection overlays must never serialize into the SVG."
      - "Use a compact Preferences & shortcuts dialog, not a full settings page."
      - "General multi-object transform is deferred from this goal."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

