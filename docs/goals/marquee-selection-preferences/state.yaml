        - "rg -n \"class SvgEditor|#on|onPointer|mousedown|touchstart|click|dblclick|wheel|pan|clientTo|screenCTM|getScreenCTM|getBoundingClientRect|selectionContext|select|highlight|overlay|serializeSvg|data-lineage|setZoom|zoom\" src/client/canvas/editor.ts"
