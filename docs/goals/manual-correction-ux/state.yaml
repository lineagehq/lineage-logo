      - "The proposed behavior changes SVG hierarchy, paint order, source IDs, referenced resources, or clean serialization."
      - "Click, drill, or hover conflicts irreconcilably with direct manipulation, panning, Alt-click, double-click, save, or history."
      - "Implementation requires files outside allowed_files."
      - "Verification fails twice for the same unresolved cause."
    receipt:
      result: done
      changed_files:
        - README.md
        - src/client/main.ts
        - src/client/styles.css
        - src/client/canvas/editor.ts
        - tests/editor-serialization.test.ts
        - tests/fidelity.test.ts
      commands:
        - cmd: "npm run check"
