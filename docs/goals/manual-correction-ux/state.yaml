        - cmd: "git diff --check"
          status: pass
        - cmd: "Manual browser smoke test"
          status: pass
      summary: "Implemented stable active scope, exact hover prediction, drill-in/back controls, ancestry breadcrumbs, unified canvas/layer/breadcrumb identity, direct-target shortcuts, and session-key history restoration with ancestor fallback. Context-only interactions do not dirty the document or create history entries. Browser smoke verified hover/click agreement, scoped child targeting, breadcrumb/back behavior, Alt-click/double-click, layer synchronization, real drag plus undo context restoration, reset, artifact cleanup, and a clear console. Added focused selection, serialization, fallback, and fidelity coverage; all 20 tests pass."
      deviations:
        - "The browser smoke did not create a saved iteration because that would write outside T002 allowed_files. Automated clean-serialization tests verify that hover, handles, breadcrumbs, and data-lineage attributes do not survive saves."
      remaining_blockers: []
      verification_attempts: 1
      stopped_because: null
  - id: T003
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Review the selection milestone and specify safe SVG hierarchy semantics for rename, lock, reorder, group, and ungroup."
    inputs:
      - "T001 and T002 receipts"
      - "Current dirty diff"
      - "Selection browser evidence"
      - "SVG fidelity tests"
    constraints:
      - "Read-only."
      - "Reject hierarchy operations that cannot preserve referenced IDs, transforms, masks, clip paths, gradients, filters, and rendering order."
      - "Specify the largest safe layer-organization Worker package."
    expected_output:
      - "Selection milestone decision"
      - "Hierarchy mutation contract"
      - "Exact Worker objective and allowed_files"
      - "Fidelity fixtures and verify commands"
      - "Stop conditions"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "T002 is approved: the diff establishes stable session identity, scoped targeting, synchronized canvas/layer/breadcrumb selection, clean serialization, and history restoration; the automated gate passes and the recorded browser smoke covers the interaction contract. T004 may proceed only with guarded hierarchy semantics. Grouping requires a coherent minimal multi-selection foundation now; deferring all multi-selection to T005 would make grouping unusable. Safe operations must leave source IDs and references untouched, use neutral groups, preserve coordinate space and unaffected paint order, and reject style-sensitive or attribute-bearing ungroup cases. T005 should build alignment on this foundation rather than recreate selection."
      worker_package:
        objective: "Deliver the complete layer-organization vertical slice. Extend selection to a same-parent selection set sufficient for grouping: normal click replaces the set; Shift-click in canvas or Layers toggles a direct sibling within the current scope; Alt-click and double-click remain single direct-target shortcuts; one primary node drives the inspector; secondary selection is visibly synchronized across canvas and Layers; selection keys, primary key, and scope restore through undo/redo with surviving-ancestor fallback. Rename is single-selection only and writes a trimmed standards-based aria-label used by Layers and breadcrumbs; it must never change an existing id or any URL, href, xlink:href, animation, or other reference. Build labels with DOM textContent, never source-derived innerHTML. Lock is editor-session state keyed by data-lineage-key: locked nodes remain selectable so they can be unlocked, but the node and descendants cannot be dragged, resized, rotated, nudged, styled, renamed, duplicated, deleted, reordered, grouped, or ungrouped; lock state must not dirty or serialize and clears on reset/load/reopen. Reorder one node or a contiguous selected block only among selectable siblings with the same actual DOM parent; move exactly one adjacent sibling position, preserve block order and every other node's relative order, and describe commands as earlier/later to make SVG paint-order direction explicit. Disable reorder when a style element could make sibling/ancestry selectors change beyond intended paint order. Group only two or more contiguous selectable element siblings with the same actual DOM parent, no locked node or locked ancestor, and no style element in the document. Insert one SVG-namespace g at the first selected position, append the selected nodes in existing order, assign only session editor identity, add no id/transform/style/presentation/accessibility attribute, preserve every child node and attribute verbatim, and select the new group. Ungroup only one neutral g whose only attributes are removable editor-session attributes, whose direct element children are supported selectable graphics, which is not locked, and in a document with no style element; insert its children in order at the group's exact position, remove the empty wrapper, and select the unwrapped children. Named, transformed, clipped, masked, filtered, painted, classed, styled, accessible, or otherwise attributed groups must remain intact with a clear disabled explanation. Every document mutation is one undo checkpoint, updates dirty state and layer UI, is resettable, and preserves stable selection context. A group→clean save→reload→ungroup round trip must work because safety is inferred from a neutral standards-compliant g, without persistent proprietary markers. Preserve existing direct manipulation, panning, visibility, saving, resource nodes, source accessibility attributes outside an explicit rename, and ordinary SVG serialization. Add representative positive and negative hierarchy fidelity coverage and complete the browser smoke."
        allowed_files:
          - README.md
          - src/client/main.ts
          - src/client/styles.css
          - src/client/canvas/editor.ts
          - tests/editor-serialization.test.ts
          - tests/fidelity.test.ts
          - tests/fixtures/workspace/concepts/concept-1.svg
        verify:
          - "npm run check"
          - "git diff --check"
          - "Automated fidelity fixtures: rename changes only aria-label while preserving source IDs and every URL/href reference; lock never appears in clean serialization; adjacent reorder changes only the requested sibling order; grouping contiguous same-parent siblings preserves child order, IDs, transforms, clip-path, mask, filter, gradient references, href references, resource subtrees, and accessibility attributes; clean-save/reload/ungroup of the neutral wrapper restores the original child hierarchy; undo/redo/reset restore hierarchy and selection-set context."
          - "Automated rejection fixtures: group rejects non-contiguous or different-parent selections, locked nodes, and documents containing style; ungroup rejects any g with a non-editor attribute including id, transform, class, style, opacity, fill, stroke, clip-path, mask, filter, role, or aria-*; reorder rejects unsafe style-bearing documents; every rejection leaves markup, dirty state, history, IDs, references, and order unchanged."
          - "Manual browser smoke test: Shift-select two adjacent sibling layers from canvas and Layers; confirm primary/secondary clarity; rename without changing the SVG id; lock and verify every mutation path is blocked while unlock remains reachable; reorder earlier/later and visually confirm only intended paint order changes; group and ungroup with unchanged appearance; verify unsafe named/effected groups explain why ungroup is disabled; undo/redo each mutation; reset; save/reopen; confirm neutral-group ungroup remains available, locks reset, layer names persist through aria-label, no editor attributes survive, favicon previews remain correct, and console is clear."
        stop_if:
          - "A usable Group control cannot be implemented without a coherent same-parent selection set and selection/history restoration inside the allowed files."
          - "Any supported operation would rewrite or remove an existing source id, URL reference, href/xlink:href reference, transform, mask, clip path, gradient, filter, resource node, accessibility attribute outside explicit rename, or unsupported subtree."
          - "Grouping requires a transform-flattening or coordinate-conversion algorithm rather than insertion of a neutral same-parent wrapper."
          - "Ungrouping a non-neutral, named, transformed, styled, clipped, masked, filtered, painted, classed, accessible, referenced, or otherwise attributed group is required for the representative workflow."
          - "A style-bearing document cannot be guarded from ancestry/sibling-selector changes while still presenting a truthful disabled state."
          - "Lock or multi-selection state would require persistent proprietary metadata or an editor artifact that survives clean serialization."
          - "The representative browser fixture changes visual geometry or appearance after group/ungroup beyond the explicit reorder operation."
          - "Implementation requires files outside allowed_files."
          - "Verification fails twice for the same unresolved cause."
      evidence:
        - kind: selection_milestone
          details: "T002 changed only its approved files and implemented active scope, direct/scoped resolution, hover prediction, breadcrumbs, drill controls, unified layer identity, and session-key restoration. Its receipt records a successful browser smoke; the only deviation was avoiding an iteration write outside Worker scope."
        - kind: current_verification
          details: "Independent Judge execution of npm run check and git diff --check passed: TypeScript, 20 Vitest tests across four files, and the Vite production build are green."
        - kind: serialization_and_identity
          details: "Clean serialization removes data-lineage attributes and hover state while retaining source accessibility attributes. Undo snapshots retain session keys, selection/scope paths fall back to surviving ancestors, and duplicate remaps clone IDs without altering source IDs."
        - kind: hierarchy_risk
          details: "The current fixture includes gradient, clipPath, mask, filter, transforms, and URL references. Existing tests prove no-op preservation but do not yet exercise hierarchy mutation. Neutral same-parent grouping preserves coordinate space and contiguous paint order by construction; ungroup of attributed groups would lose semantics and is therefore rejected."
        - kind: dependency_decision
          details: "Grouping two or more user-chosen layers is not usable with the current single-selection contract. T004 must add the bounded same-parent selection set and history semantics required by grouping; T005 can then focus on alignment behavior over that established set."
      subgoal_contract: null
      parallel_safety:
        safe: false
        reason: "Selection cardinality, editor history, hierarchy mutation, layer rendering, controls, styles, and the same fidelity tests overlap. One Worker must own the vertical slice."
      blocked_tasks: []
      missing_evidence:
        - "No automated test yet proves group/ungroup round-trip fidelity or guarded rejection of unsafe SVG structures."
        - "No browser evidence yet proves rename, session lock, reorder, grouping, ungrouping, selection-set restoration, save/reopen, or disabled explanations."
        - "The full manual-correction oracle remains incomplete until alignment, validated appearance, QA polish, and final walkthrough tasks finish."
      required_board_updates:
        - "Record this receipt on T003 and mark T003 done."
        - "Activate T004 and replace its Worker contract with this worker_package."
        - "Keep T005 queued but revise its objective to add alignment controls and complete multi-selection manipulation on the T004 selection-set foundation, rather than reimplementing selection."
        - "Keep T006, T007, and T999 queued; full_outcome_complete remains false."
        - "Do not parallelize T004."
