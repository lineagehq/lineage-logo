      - "Manual browser smoke test: normal-click selects the predicted target; hover matches; Edit inside exposes direct children; Back to group returns one level; breadcrumb ancestor selection works; Alt-click and double-click still select direct hits; layer-panel selection stays synchronized; drag and undo preserve context; reset clears context; save/reopen contains no editor artifacts; console remains clear."
    stop_if:
