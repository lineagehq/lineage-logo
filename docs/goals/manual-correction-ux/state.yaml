      - "Preserve click, double-click, Alt-click, direct manipulation, history, and save behavior."
      - "Selection identity must be stable enough for later grouping and agent context."
    expected_output:
      - "Working selection breadcrumb and drill controls"
      - "Hover affordance that matches the next click target"
      - "Focused regression coverage"
      - "Verification receipt"
    allowed_files:
