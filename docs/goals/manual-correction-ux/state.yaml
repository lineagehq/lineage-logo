version: 2

goal:
  title: "Make Manual Logo Corrections Clear and Complete"
  slug: "manual-correction-ux"
  kind: existing_plan
  tranche: "Complete the correction UX through successive verified vertical slices, ending with the full browser oracle."
  status: done
  oracle:
    signal: "A recorded browser walkthrough proves nested selection, layer organization and grouping, multi-select alignment, validated styling, history, saving, reopening, and SVG fidelity."
    cadence: "after each Worker package and at final audit"
    final_proof: "npm run check passes and the final Judge receipt maps the completed browser walkthrough and fidelity evidence to the original correction-UX outcome."
  intake:
    original_request: "Implement the correction UX first and use agentic connection later for adding new SVG layers."
    interpreted_outcome: "A clear, dependable manual correction and layer-organization canvas that preserves ordinary SVG interoperability."
    input_shape: existing_plan
    audience: "people correcting AI-generated SVG logos"
    authority: approved
    proof_type: demo
    completion_proof: "Automated checks plus a recorded end-to-end browser walkthrough of the full correction workflow."
    likely_misfire: "Controls exist and tests pass, but selection remains confusing or hierarchy edits damage SVG fidelity."
    blind_spots_considered:
      - "Referenced IDs, transforms, gradients, masks, clip paths, and filters during group and ungroup operations."
      - "Multi-selection history and selection-state restoration."
      - "Responsive toolbar layout, invalid color input, no-op history entries, and development port handling."
    existing_plan_facts:
      - "Correction UX precedes the agent bridge."
      - "Include selection breadcrumbs, drill-in and out, hover targeting, rename, lock, reorder, group and ungroup, multi-select, alignment, and validated color controls."
      - "Exclude drawing tools and new manual layer creation."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/manual-correction-ux/"
    command: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/manual-correction-ux"

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the existing correction-UX plan, define the durable selection and hierarchy contract, and select the largest safe first Worker slice."
    inputs:
      - "README.md"
      - "docs/MVP.md"
      - "src/client"
      - "tests"
      - "The intake facts in this board"
    constraints:
      - "Read-only."
      - "Preserve the user-approved feature set and non-goals."
      - "Require explicit SVG fidelity risks, allowed files, verification, and stop conditions for the first Worker."
    expected_output:
      - "Validated selection and hierarchy interaction contract"
      - "Risk and dependency ordering"
      - "Exact first Worker objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "The approved plan is coherent and correctly sequences selection clarity before hierarchy mutation and multi-selection. The current editor has a usable top-level-versus-direct-target distinction, session-only node keys, clean serialization, and a mirrored layer tree, but lacks an explicit scope model, breadcrumb, hover oracle, drill controls, and selection restoration across history. T002 is the largest safe first slice because it can establish these semantics without mutating SVG hierarchy or widening into drawing, grouping, or agent integration. Hierarchy mutation must remain gated by T003 because transforms, paint order, IDs, and referenced resources require a separate fidelity contract."
      worker_package:
        objective: "Deliver the complete selection-clarity vertical slice under this contract: the inline SVG DOM remains source of truth; the SVG root, defs, metadata, resource nodes, and editor handles are never selectable; supported editable graphics retain a session-only data-lineage-key while source IDs remain unchanged. Maintain one active scope and at most one selection. The initial scope is the SVG root. A normal click or hover resolves to the direct selectable descendant of the active scope containing the hit. Alt-click and double-click preserve the existing direct-target shortcut while synchronizing scope to the target's selectable parent. Edit inside group keeps the group selected, makes it the active scope, and causes subsequent hover/click targeting to resolve among its direct selectable descendants. Back to group selects the current scope and moves scope to its selectable parent. The breadcrumb shows selectable ancestry from the top-level layer through the selection, labels nodes by unique source ID or deterministic tag/sibling fallback, and lets a user select an ancestor without changing SVG content. Canvas, breadcrumb, and layer-panel selection must use the same session identity. Hover must exactly predict the next normal-click target and must not mutate serialized SVG, dirty state, or history. Undo/redo should restore selection and scope by session key when surviving nodes exist; otherwise fall back to the nearest surviving selectable ancestor or root scope. Reset and file load return to root scope with no selection. Selection/context changes are never document mutations. Preserve drag, resize, rotate, nudging, appearance editing, duplicate, visibility, delete, panning, dirty state, save, and clean serialization. Add focused selection-resolution, serialization, and hierarchy-sensitive fidelity coverage plus the browser smoke test."
        allowed_files:
          - README.md
          - src/client/main.ts
          - src/client/styles.css
          - src/client/canvas/editor.ts
          - tests/editor-serialization.test.ts
          - tests/fidelity.test.ts
        verify:
          - "npm run check"
          - "git diff --check"
          - "Manual browser smoke test: normal-click selects the predicted top-level target; hover matches that target; Edit inside exposes direct children; Back to group returns one level; breadcrumb ancestor selection works; Alt-click and double-click still select the direct hit target; layer-panel selection stays synchronized; drag and undo preserve selection context; reset clears context; save/reopen contains no hover, handle, breadcrumb, or data-lineage artifacts; browser console remains clear."
        stop_if:
          - "A representative supported SVG requires selectable nested svg, use/symbol shadow content, defs/resource content, or another node category outside the documented editable set; return the fixture and ambiguity for Judge review."
          - "Hover or breadcrumb implementation would require a class, ID, wrapper, or other editor artifact that survives clean serialization."
          - "Selection or scope cannot be restored across DOM replacement using session keys without changing files outside allowed_files."
          - "The proposed behavior changes SVG hierarchy, paint order, source IDs, referenced resources, or ordinary clean SVG serialization."
          - "Click, drill, or hover event handling conflicts with direct manipulation, panning, Alt-click, double-click, save, or history and the conflict cannot be resolved within this slice."
          - "Implementation requires files outside allowed_files."
          - "Verification fails twice for the same unresolved cause."
      evidence:
        - kind: scope_validation
          details: "The board intake and goal charter preserve the approved feature set and non-goals.,docs/MVP.md requires top-level and named-group selection, child drill-down, active selection naming, unsupported-node preservation, ordinary SVG serialization, and fidelity across IDs, gradients, masks, clip paths, filters, transforms, and references.,README.md documents current normal-click logical-group selection and direct selection through double-click or Alt-click."
        - kind: current_selection_evidence
          details: "getLogicalSelectionTarget resolves a hit to its top-level SVG child and excludes the SVG root.,Canvas events use normal click for logical target and Alt-click/double-click for direct target.,The Layers panel calls the same editor.selectNode entry point.,Existing tests do not cover nested scope, breadcrumb, hover, drill-out, or history restoration."
        - kind: identity_and_fidelity_evidence
          details: "The editor assigns data-lineage-key values to supported graphics and retains them in undo snapshots.,Clean serialization strips editor data and handles while retaining source accessibility attributes.,Undo/redo replaces the SVG DOM and currently clears selection.,Fidelity tests cover representative IDs and resources but not hierarchy mutation safety."
        - kind: dependency_order
          details: "Establish deterministic single-selection identity, active scope, hover prediction, breadcrumb, and drill behavior.,T003 defines safe hierarchy semantics before T004.,Multi-selection and alignment follow stable identity and hierarchy semantics.,Validated appearance and remaining QA polish finish the correction surface.,The full browser oracle and saved-SVG inspection close the tranche."
        - kind: risk_register
          details: "DOM replacement invalidates node references unless scope and selection restore by session identity.,Hover styling on source nodes can leak into saves or dirty state.,SVG.js handle groups can be mistaken for layers.,Fallback labels are display locators, not persistent source identity.,Nested svg and use/symbol content are not covered.,Grouping and reorder can alter paint order, transforms, and references and remain outside T002."
      parallel_safety:
        safe: false
        reason: "The first slice spans shared editor state, event resolution, layer rendering, UI, styles, and overlapping regression tests. Keep one write Worker."
      blocked_tasks: []
      missing_evidence:
        - "No browser evidence yet proves hover prediction or drill behavior."
        - "No automated tests cover scope resolution, breadcrumb ancestry, direct-target shortcuts under scope, or selection restoration."
        - "No current fixture approves group, ungroup, or reorder fidelity; that remains deferred to T003."
      required_board_updates:
        - "Record this receipt on T001 and mark it done."
        - "Set T002 active and apply this worker_package."
        - "Keep T003 through T999 queued and full_outcome_complete false."
        - "Do not parallelize T002."
