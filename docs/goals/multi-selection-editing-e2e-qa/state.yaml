# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Multi-Selection Editing Browser QA"
  slug: "multi-selection-editing-e2e-qa"
  kind: existing_plan
  tranche: "Automate the complete collective movement, history, arrangement, rejection, and serialization workflow in real Chromium using the complex Seatify fixture."
  status: active
  oracle:
    signal: "Real Chromium proves exact shared root-space movement, deterministic arrangement, one-step history, all-or-nothing rejection, stable selection, and clean SVG serialization for complex multi-selections."
    cadence: "after each Worker package and at final audit"
    final_proof: "Green full scenario matrix, ten repetitions, clean-checkout and cleanup proof, protected CI success, and a final Judge receipt with full_outcome_complete: true."
  intake:
    original_request: "Plan automated browser QA for multi-selection editing."
    interpreted_outcome: "The repository reliably catches regressions across the complete multi-selection correction loop under real browser input."
    input_shape: existing_plan
    audience: "Lineage Logo maintainers and users correcting layered SVG logos"
    authority: approved
    proof_type: test
    completion_proof: "The complete browser matrix passes repeatedly and in protected CI while proving exact geometry, history, selection, rejection, and serialization invariants."
    likely_misfire: "Add method-level or screenshot-only tests that never prove all selected objects moved together, history remained atomic, or runtime metadata stayed out of SVG output."
    blind_spots_considered:
      - "Cross-parent transforms, root-space deltas, and drag from a selected non-primary object."
      - "History checkpoint cardinality, cancellation, below-threshold, zero-delta, and no-op behavior."
      - "Locked, hidden, disconnected, ineligible, and agent-review all-or-nothing gates."
      - "Deterministic alignment/distribution anchors, ordering, overlap, and zero-size geometry."
      - "Zoom, collapsed sidebars, primary identity, inspector continuity, serialization, cleanup, CI runtime, and repeat stability."
    existing_plan_facts:
      - "Reuse the deterministic Chromium harness, complex Seatify fixture, strict ports, descriptive .localhost origin, and byte-exact temporary workspace."
      - "Use real keyboard and pointer input with live geometry-derived coordinates and no fixed sleeps."
      - "Cover collective drag, Arrow/Shift+Arrow, undo/redo, alignment, distribution, equal spacing, rejection, 125% zoom, collapsed sidebars, Layers parity, and clean SVG output."
      - "Keep the existing marquee-preview suite and protected verify/browser-qa jobs green."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/multi-selection-editing-e2e-qa/"
